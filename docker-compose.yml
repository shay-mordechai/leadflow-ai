version: '3.8'

services:
  leadflow_app:
    container_name: leadflow_app
    image: ghcr.io/shay-mordechai/leadflow-ai:latest
    ports:
      - "443:8443"
    env_file:
      - .env
    volumes:  # תוקן מ-volume ל-volumes
      - ./certs:/app/certs:ro
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 8443
      --ssl-keyfile /app/certs/key.pem
      --ssl-certfile /app/certs/cert.pem
    depends_on:
      - leadflow_db
    restart: always

  leadflow_db:
    container_name: leadflow_db
    image: registry.redhat.io/rhel9/postgresql-15
    volumes:
      - postgres_data:/var/lib/pgsql/data
    environment:
      # --- Red Hat Specific Variables ---
      - POSTGRESQL_USER=myuser
      - POSTGRESQL_PASSWORD=mypassword
      - POSTGRESQL_DATABASE=leadflow
    restart: always

volumes:
  postgres_data:
