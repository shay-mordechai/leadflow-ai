version: '3.8'

services:
  # 1. The Brain: FastAPI Application
  app:
    # CRITICAL CHANGE: Use the pre-built image from GitHub Registry
    # This prevents the EC2 server from crashing due to high RAM usage during build.
    image: ghcr.io/shay-mordechai/leadflow-ai:latest
    container_name: leadflow_app
    restart: always
    # Explicit DNS to ensure external connections (Meta/OpenAI) work
    dns:
      - 8.8.8.8
    # Run Uvicorn directly
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./storage:/app/storage  # Shared volume for audio files
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  # 2. The Muscle: Python Background Worker (RAM Optimized)
  worker:
    # CRITICAL CHANGE: Use the exact same pre-built image
    image: ghcr.io/shay-mordechai/leadflow-ai:latest
    container_name: leadflow_worker
    restart: always
    dns:
      - 8.8.8.8
    # Runs the dedicated worker script
    command: ["python", "src/worker.py"]
    volumes:
      - ./storage:/app/storage  # Must match the app volume!
    env_file:
      - .env
    depends_on:
      - db

  # 3. Memory: PostgreSQL Database
  db:
    image: postgres:15
    container_name: leadflow_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-leadflow}
    ports:
      - "5432:5432"

  # 4. Security: Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}

volumes:
  postgres_data: