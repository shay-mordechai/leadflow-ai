version: '3.8'

services:
  db:
    image: postgres:15
    container_name: leadflow_db_dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  app:
    # Development: Build from local source instead of pulling from registry
    build: .
    container_name: leadflow_app_dev
    # Uses --reload for immediate feedback on code changes
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src  # Hot Reload: Syncs local changes to container immediately
      - ./storage:/app/storage
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always

  worker:
    build: .
    container_name: leadflow_worker_dev
    command: python -m src.worker
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./src:/app/src  # Syncs code for the worker too
      - ./storage:/app/storage
    env_file: .env
    depends_on:
      - db
    restart: always

  # ⚠️ WARNING: Do not run the production tunnel locally!
  # It will conflict with the active production server and cause downtime.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared_dev
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
  #   restart: always
  #   env_file: .env

volumes:
  postgres_data_dev: