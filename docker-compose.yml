# docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:15
    container_name: leadflow_db_dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  app:
    # Development: Build from local source (Hot Reload enabled)
    build: .
    container_name: leadflow_app_dev
    
    # Command: Uses uvicorn directly with --reload for fast feedback loop
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    
    volumes:
      - ./src:/app/src  # Syncs local code changes to container immediately
      - ./storage:/app/storage
    
    # Development uses local .env file (Production uses AWS SSM)
    env_file: .env
    
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always

  worker:
    # Optional: Only needed if you run background tasks via Celery in Dev.
    # In Prod, currently running as Monolith within the main app container.
    build: .
    container_name: leadflow_worker_dev
    command: python -m src.worker
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./src:/app/src
      - ./storage:/app/storage
    env_file: .env
    depends_on:
      - db
    restart: always

volumes:
  postgres_data_dev: