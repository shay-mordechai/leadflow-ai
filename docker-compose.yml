version: '3.8'

services:
  db:
    image: postgres:15
    container_name: leadflow_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  app:
    image: ghcr.io/shay-mordechai/leadflow-ai:latest
    container_name: leadflow_app
    command: gunicorn src.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    volumes:
      - ./storage:/app/storage
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always

  worker:
    image: ghcr.io/shay-mordechai/leadflow-ai:latest
    container_name: leadflow_worker
    # --- CRITICAL CONFIGURATION ---
    # Running as a module (-m) fixes relative import issues
    command: python -m src.worker
    working_dir: /app
    environment:
      # Ensures Python recognizes /app as the root package directory
      - PYTHONPATH=/app
    volumes:
      - ./storage:/app/storage
    env_file: .env
    depends_on:
      - db
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    restart: always
    env_file: .env

volumes:
  postgres_data:
