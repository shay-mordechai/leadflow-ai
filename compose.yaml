# compose.yaml
version: '3.8'

networks:
  leadflow-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:
  db:
    image: postgres:15-alpine
    container_name: leadflow-db
    networks:
      - leadflow-network
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: leadflow_secret
      POSTGRES_DB: leadflow_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow -d leadflow_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: leadflow-redis
    networks:
      - leadflow-network
    restart: unless-stopped
    ulimits:
      core: 0
    command: redis-server --appendonly yes

  backend:
    image: ghcr.io/shay-mordechai/leadflow-backend:latest
    container_name: leadflow-backend
    networks:
      - leadflow-network
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    ulimits:
      core: 0
    mem_limit: 1.5g
    mem_reservation: 512m
    command: gunicorn src.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 120
    env_file:
      - .env.production
    environment:
      - WHISPER_USE_MMAP=1
      - OMP_NUM_THREADS=2
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://leadflow:leadflow_secret@db:5432/leadflow_prod
      - EXPECTED_DB_REVISION=${EXPECTED_DB_REVISION:-}
      - CURRENT_IMAGE_SHA=${CURRENT_IMAGE_SHA:-}
    volumes:
      - ./storage:/app/storage:Z
      - ./data:/app/data:Z
      - ./models:/app/models:ro,Z
    depends_on:
      - redis
      - db

  worker:
    image: ghcr.io/shay-mordechai/leadflow-backend:latest
    container_name: leadflow-worker
    networks:
      - leadflow-network
    restart: unless-stopped
    ulimits:
      core: 0
    mem_limit: 1.5g
    mem_reservation: 512m
    command: ["celery", "-A", "src.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - .env.production
    environment:
      - WHISPER_USE_MMAP=1
      - OMP_NUM_THREADS=2
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./storage:/app/storage:Z
      - ./data:/app/data:Z
      - ./models:/app/models:ro,Z
    depends_on:
      - redis

  beat:
    image: ghcr.io/shay-mordechai/leadflow-backend:latest
    container_name: leadflow-beat
    networks:
      - leadflow-network
    restart: unless-stopped
    ulimits:
      core: 0
    command:
      - celery
      - -A
      - src.worker.celery_app
      - beat
      - --loglevel=info
      - --schedule=/app/data/celerybeat-schedule
    env_file:
      - .env.production
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./storage:/app/storage:Z
      - ./data:/app/data:Z
    depends_on:
      - redis

  frontend:
    image: ghcr.io/shay-mordechai/leadflow-frontend:latest
    container_name: leadflow-frontend
    networks:
      - leadflow-network
    ports:
      - "0.0.0.0:3000:3000"
    restart: unless-stopped
    ulimits:
      core: 0
    environment:
      - NEXT_PUBLIC_API_URL=https://my-leads.app

  data-gate:
    image: ghcr.io/shay-mordechai/leadflow-data-gate:latest
    container_name: leadflow-data-gate
    networks:
      - leadflow-network
    restart: unless-stopped
    ulimits:
      core: 0