services:
  postgres-dev:
    image: docker.io/pgvector/pgvector:pg16
    container_name: leadflow-pg-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_root_password
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - leadflow_pg_dev_data:/var/lib/postgresql/data
      - ./scripts/init_db_roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-dev:
    image: docker.io/library/redis:7-alpine
    container_name: leadflow-redis-dev
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  leadflow_pg_dev_data:
