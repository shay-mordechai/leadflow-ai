<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>הרשמה | My-Leads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Heebo', sans-serif; }
        /* Custom scrollbar for form container */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden py-10">

    <div class="absolute top-0 right-0 w-96 h-96 bg-blue-600/20 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-0 left-0 w-96 h-96 bg-purple-600/20 rounded-full blur-[100px]"></div>

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl relative z-10 overflow-hidden">
        
        <div class="bg-slate-50 p-8 text-center border-b border-slate-100">
            <h1 class="text-2xl font-black text-slate-800 mb-1">יצירת חשבון חדש</h1>
            <p class="text-slate-500 text-sm">הפרד בין העסק לחיים האישיים</p>
            <p id="planDisplay" class="text-blue-600 text-xs font-bold mt-2"></p>
        </div>

        <form id="registerForm" class="space-y-5 p-8 max-h-[70vh] overflow-y-auto custom-scrollbar">
            
            <input type="hidden" name="plan" id="planInput" value="start">

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">שם מלא</label>
                <input type="text" id="fullName" name="full_name" required 
                       class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 transition font-medium text-slate-800" 
                       placeholder="ישראל ישראלי">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">אימייל</label>
                <input type="email" id="email" name="email" required dir="ltr" 
                       class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 transition text-right" 
                       placeholder="you@company.com">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">סיסמה</label>
                <input type="password" id="password" name="password" required dir="ltr" minlength="6" 
                       class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 transition text-right" 
                       placeholder="******">
            </div>

            <div class="relative">
                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">
                    וואטסאפ אישי (לקבלת לידים)
                </label>
                <input type="tel" id="whatsapp" name="personal_whatsapp" required dir="ltr" 
                       class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 transition text-right font-mono" 
                       placeholder="050-XXXXXXX">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase">תחום עיסוק</label>
                <select name="business_type" id="business_type" onchange="toggleOtherField()" 
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 text-sm" required>
                    <option value="" disabled selected>בחר מהרשימה...</option>
                    
                    <optgroup label="כושר, בריאות וסטודיו">
                        <option value="Yoga Instructor">מורה ליוגה</option>
                        <option value="Pilates Instructor">מדריכת פילאטיס</option>
                        <option value="Fitness Trainer">מאמן/ת כושר אישי</option>
                        <option value="Studio">בעלי סטודיו</option>
                    </optgroup>

                    <optgroup label="נדל״ן ופיננסים">
                        <option value="Real Estate Agent">מתווך נדל"ן</option>
                        <option value="Mortgage Advisor">יועץ משכנתאות</option>
                        <option value="Insurance Agent">סוכן ביטוח</option>
                    </optgroup>

                    <optgroup label="אימון וטיפול (Coaching)">
                        <option value="Business Coach">מאמן עסקי / מנטור</option>
                        <option value="Life Coach">מאמן אישי (Life Coach)</option>
                        <option value="Therapist">מטפל / פסיכולוג</option>
                    </optgroup>

                    <optgroup label="שירותי בית (Home Services)">
                        <option value="Plumber">אינסטלטור</option>
                        <option value="Electrician">חשמלאי</option>
                        <option value="Handyman">הנדימן / שיפוצים</option>
                        <option value="Locksmith">מנעולן</option>
                    </optgroup>

                    <option value="Other">אחר (נא לפרט...)</option>
                </select>
                
                <input type="text" name="other_business_type" id="other_business_type" style="display:none;" 
                       placeholder="הקלד את תחום העיסוק שלך..." 
                       class="mt-2 w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <div class="flex items-start gap-3 pt-2">
                <input type="checkbox" id="tosCheck" required class="mt-1 w-4 h-4 text-blue-600 rounded border-gray-300 cursor-pointer">
                <label for="tosCheck" class="text-xs text-slate-500 cursor-pointer select-none leading-relaxed">
                    מאשר את <a href="/terms" target="_blank" class="underline text-blue-600">תנאי השימוש</a> ואת <a href="/privacy" target="_blank" class="underline text-blue-600">מדיניות הפרטיות</a>.
                </label>
            </div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-xl shadow-lg transition transform active:scale-[0.98]">
                הרשמה למערכת
            </button>
            
            <p class="text-center text-xs text-slate-400">
                כבר יש לך חשבון? <a href="/login" class="text-blue-600 font-bold hover:underline">התחבר כאן</a>
            </p>
        </form>
    </div>

    <script>
        // --- 1. CAPTURE PLAN FROM URL ---
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const selectedPlan = urlParams.get('plan') || 'start'; 
            
            document.getElementById('planInput').value = selectedPlan;
            
            const planDisplay = document.getElementById('planDisplay');
            if(selectedPlan === 'pro') {
                planDisplay.innerText = 'בחירה מצוינת: חבילת Pro';
            } else if (selectedPlan === 'start') {
                 planDisplay.innerText = 'נרשם לחבילת Start (חינם)';
            }
        };

        // --- 2. HANDLE 'OTHER' BUSINESS TYPE ---
        function toggleOtherField() {
            const isOther = document.getElementById('business_type').value === 'Other';
            const otherInput = document.getElementById('other_business_type');
            otherInput.style.display = isOther ? 'block' : 'none';
            otherInput.required = isOther;
            if (isOther) {
                otherInput.focus();
            }
        }

        // --- 3. FORM SUBMISSION LOGIC ---
        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            
            btn.innerHTML = '⏳ יוצר חשבון...';
            btn.disabled = true;

            const formData = new FormData(e.target);
            
            let finalBusinessType = formData.get('business_type');
            if (finalBusinessType === 'Other') {
                finalBusinessType = formData.get('other_business_type');
            }

            const payload = {
                full_name: formData.get('full_name'),
                email: formData.get('email'),
                password: formData.get('password'),
                personal_whatsapp: formData.get('personal_whatsapp'),
                business_type: finalBusinessType,
                plan_tier: formData.get('plan')
            };

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    window.location.href = '/login?registered=true';
                } else {
                    const err = await response.json();
                    console.error('Server Error:', err);
                    alert('שגיאה בהרשמה: ' + (err.detail || 'נסה שנית'));
                }
            } catch (error) {
                console.error('Network Error:', error);
                alert('שגיאת תקשורת. אנא בדוק את החיבור לאינטרנט.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
