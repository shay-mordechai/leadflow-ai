name: LeadFlow Professional Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Login to Registry
            echo ${{ secrets.GITHUB_TOKEN }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Pull the NEW LeadFlow image
            podman pull ghcr.io/${{ github.repository }}:latest

            # 3. Stop the Entire Pod (K8s Style Shutdown)
            # This stops all containers in the pod including the DB
            podman pod stop leadflow-pod || true

            # 4. Remove ONLY the app container
            # We keep leadflow_db so we don't have to re-run its complex config
            podman rm -f leadflow_app || true

            # 5. Run the NEW app container inside the existing Pod
            # Notice: No port mapping here (-p), it's handled by the Pod
            podman run --name leadflow_app \
              --pod leadflow-pod \
              --dns 8.8.8.8 \
              --env-file ~/leadflow-ai/.env \
              -v ~/leadflow-ai/storage:/app/storage:Z \
              -d ghcr.io/${{ github.repository }}:latest

            # 6. Start the Pod back up
            podman pod start leadflow-pod

            # 7. Cleanup old images (Anti-Sha'ariyot)
            podman image prune -f

            echo "🚀 LeadFlow Pod updated and restarted successfully!"
