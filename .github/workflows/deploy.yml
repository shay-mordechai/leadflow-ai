# .github/workflows/deploy.yml
# .github/workflows/deploy.yml
name: LeadFlow Production Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shay-mordechai/leadflow-ai

jobs:
  # --- JOB 1: BUILD ---
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # --- JOB 2: DEPLOY WITH SMART ROLLBACK & CLEANUP ---
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Configure SSH & Tunnel
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${{ secrets.CF_SSH_HOSTNAME }}
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_SERVICE_ID }} --secret ${{ secrets.CF_SERVICE_SECRET }}
          EOF

      - name: Deploy with Log Analysis, Rollback & Cleanup
        run: |
          ssh production "mkdir -p ~/leadflow-ai"
          scp docker-compose.prod.yml production:~/leadflow-ai/docker-compose.yml

          ssh production "
            set -e
            cd ~/leadflow-ai
            
            # 1. Login to Registry
            echo ${{ secrets.GITHUB_TOKEN }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo '--- 1. Creating Backup of Current Stable Version ---'
            # Tag the current working image as 'rollback'
            # '|| true' allows the first-ever deploy to succeed without a backup
            podman tag ghcr.io/${{ env.IMAGE_NAME }}:latest leadflow:rollback || true
            
            echo '--- 2. Pulling and Deploying New Version ---'
            podman-compose pull
            
            # Clean restart to ensure no old config remains
            podman-compose down
            podman-compose up -d
            
            echo '--- 3. Health & Log Analysis (Waiting 15s) ---'
            sleep 15
            
            # Initialize flags
            ROLLBACK_NEEDED=false
            
            # A. Check if container is physically running
            IS_RUNNING=\$(podman inspect -f '{{.State.Running}}' leadflow-ai || echo 'false')
            
            # B. Scan recent logs for critical keywords (Case Insensitive)
            # We assume errors appear in the last 100 lines of startup logs
            RECENT_LOGS=\$(podman logs --tail 100 leadflow-ai 2>&1)
            
            if [ \"\$IS_RUNNING\" != \"true\" ]; then
                echo '❌ CRITICAL: Container is NOT running (Crashed).'
                ROLLBACK_NEEDED=true
                
            # grep -iqE: Case-insensitive, quiet, Extended regex
            elif echo \"\$RECENT_LOGS\" | grep -iqE 'exception|traceback|critical error|fatal'; then
                echo '❌ CRITICAL: Found keywords in logs (Exception/Traceback/Fatal).'
                echo '--- SUSPICIOUS LOGS ---'
                echo \"\$RECENT_LOGS\" | grep -iE 'exception|traceback|critical error|fatal'
                echo '-----------------------'
                ROLLBACK_NEEDED=true
            else
                echo '✅ Deployment Successful: Container is UP and Logs are CLEAN.'
            fi

            # --- 4. Rollback Execution (If needed) ---
            if [ \"\$ROLLBACK_NEEDED\" = \"true\" ]; then
                echo '🔄 INITIATING AUTOMATIC ROLLBACK...'
                
                # Stop the broken container
                podman-compose down
                
                # Restore the 'rollback' tag to 'latest'
                podman tag leadflow:rollback ghcr.io/${{ env.IMAGE_NAME }}:latest
                
                # Restart using the stable backup
                podman-compose up -d
                
                echo '✅ Rollback complete. System restored to previous stable version.'
                exit 1 # Fail the GitHub Action so you get an email notification
            fi
            
            # --- 5. Disk Cleanup (ONLY runs if deployment succeeded) ---
            echo '--- 🧹 Cleaning up disk space ---'