name: LeadFlow Production Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shay-mordechai/leadflow-ai

jobs:
  # --- JOB 1: BUILD ---
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Tags the image with 'latest' and the specific commit SHA
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # --- JOB 2: DEPLOY ---
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        # We need the code checkout to access 'docker-compose.prod.yml'

      # 1. Install Cloudflared (Required for ProxyCommand)
      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      # 2. Configure SSH Config using Secrets
      - name: Configure SSH & Tunnel
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Create SSH config to route traffic via Cloudflare
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${{ secrets.CF_SSH_HOSTNAME }}
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_SERVICE_ID }} --secret ${{ secrets.CF_SERVICE_SECRET }}
          EOF

      # 3. Deploy using Docker Compose
      - name: Deploy with Compose
        run: |
          # A. Copy the production compose file to the server
          scp docker-compose.prod.yml production:~/leadflow-ai/docker-compose.yml

          # B. Execute remote commands
          ssh production "
            # Stop execution on any error
            set -e
            
            # Navigate to project directory
            cd ~/leadflow-ai
            
            # Login to GHCR (required to pull private image)
            echo ${{ secrets.GITHUB_TOKEN }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the latest image defined in the compose file
            podman-compose pull
            
            # Recreate containers (Down + Up ensures a fresh state)
            # The tunnel is untouched because it is not in the compose file
            podman-compose up -d --force-recreate
          "