# .github/workflows/deploy.yml
# ==============================================================================
# ⚠️  CRITICAL CONFIGURATION WARNING - READ BEFORE EDITING  ⚠️
# ==============================================================================
# Target Server OS: Amazon Linux 2023
# Container Runtime: PODMAN (Not Docker!)
#
# IMPORTANT:
# This workflow is specifically tuned for PODMAN.
# - Do NOT change 'podman' commands back to 'docker'.
# - Do NOT change 'podman-compose' back to 'docker compose'.
#
# The EC2 server uses Podman which is daemonless and rootless by design.
# ==============================================================================

name: LeadFlow Production Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shay-mordechai/leadflow-ai

jobs:
  # --- JOB 1: BUILD (GitHub Runners use Docker, which is compatible for building) ---
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # --- JOB 2: DEPLOY (Executing Podman commands on EC2) ---
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Configure SSH & Tunnel
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${{ secrets.CF_SSH_HOSTNAME }}
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_SERVICE_ID }} --secret ${{ secrets.CF_SERVICE_SECRET }}
          EOF

      # --- Deployment Logic Script ---
      - name: Create Podman Deployment Script
        run: |
          cat <<EOF > deploy_script.sh
          #!/bin/bash
          set -e
          
          # Navigate to project directory
          mkdir -p ~/leadflow-ai
          cd ~/leadflow-ai
          
          # 1. Login to Registry using Podman
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          
          echo '--- 1. Pulling New Version ---'
          podman pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # 2. Restart with Podman Compose
          podman-compose down || true
          podman-compose up -d
          
          echo '--- 3. Health & Log Analysis (Waiting 15s) ---'
          sleep 15
          
          # Initialize validation flag
          ROLLBACK_NEEDED=false
          
          # A. Check if any leadflow container is running
          CONTAINER_ID=\$(podman ps -q --filter "name=leadflow" | head -n 1)
          
          if [ -z "\$CONTAINER_ID" ]; then
             echo '❌ CRITICAL: No container found running!'
             ROLLBACK_NEEDED=true
          else
             echo "✅ Found container ID: \$CONTAINER_ID"
             
             # B. Scan logs for startup errors
             RECENT_LOGS=\$(podman logs --tail 100 \$CONTAINER_ID 2>&1)
             
             if echo "\$RECENT_LOGS" | grep -iqE 'exception|traceback|critical error|fatal'; then
                  echo '❌ CRITICAL: Error keywords detected in logs.'
                  echo "\$RECENT_LOGS" | grep -iE 'exception|traceback|critical error|fatal'
                  ROLLBACK_NEEDED=true
             else
                  echo '✅ Deployment Successful. Server is stable.'
             fi
          fi

          if [ "\$ROLLBACK_NEEDED" = "true" ]; then
              echo '⚠️ Deployment health check failed. Please inspect logs manually.'
              exit 1
          fi
          
          # --- 4. Cleanup ---
          echo '--- 🧹 Cleaning up unused images ---'
          podman image prune -f
          EOF

      - name: Execute Deployment on Server
        run: |
          ssh production "mkdir -p ~/leadflow-ai"
          scp docker-compose.prod.yml production:~/leadflow-ai/docker-compose.yml
          scp deploy_script.sh production:~/leadflow-ai/deploy.sh
          ssh production "chmod +x ~/leadflow-ai/deploy.sh && ~/leadflow-ai/deploy.sh"