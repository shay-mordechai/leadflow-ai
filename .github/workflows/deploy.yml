# ==============================================================================
# ⚠️  CRITICAL CONFIGURATION WARNING ⚠️
# ==============================================================================
# Target Server OS: Amazon Linux 2023
# Container Runtime: PODMAN
# Architecture: Zero Trust (Cloudflare Tunnel)
#
# CRITICAL NOTE ON DEPLOYMENT LOGIC:
# The Cloudflare Tunnel runs as a SYSTEM service (container-cloudflared_host).
# This deployment script manages the APP service (leadflow-ai) as a USER service.
# We must NEVER stop the tunnel, or SSH access will be lost immediately.
# ==============================================================================
name: LeadFlow Production Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: shay-mordechai/leadflow-backend
  IMAGE_FRONTEND: shay-mordechai/leadflow-frontend
  AWS_REGION: eu-north-1

jobs:
  # --- JOB 1: BUILD BACKEND (Python) ---
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}

  # --- JOB 2: BUILD FRONTEND (Next.js) ---
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  # --- JOB 3: DEPLOY BOTH TO EC2 ---
  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared & Config SSH
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          mkdir -p ~/.ssh/
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${{ secrets.CF_SSH_HOSTNAME }}
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h --id ${{ secrets.CF_SERVICE_ID }} --secret ${{ secrets.CF_SERVICE_SECRET }}
          EOF

      - name: Create Deployment Script
        run: |
          cat <<EOF > deploy_script.sh
          #!/bin/bash
          set -e

          TAG="${{ github.sha }}"
          IMG_BACKEND="${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:$TAG"
          IMG_FRONTEND="${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:$TAG"
          
          # Enable user persistence (Runs containers after logout)
          sudo loginctl enable-linger ec2-user

          # 1. Prepare Host Directories (Prevent "File not found" errors)
          mkdir -p ~/leadflow-ai/storage
          touch ~/leadflow-ai/leads.db # Ensure DB file exists so it's mounted as file, not dir

          # 2. Login & Clean
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Aggressive cleanup to prevent Disk Full errors
          podman image prune -a -f --filter "until=1h" || true
          
          # 3. Pull New Images
          echo "⬇️ Pulling Images..."
          podman pull $IMG_BACKEND
          podman pull $IMG_FRONTEND

          # 4. Stop Old Services & CLEANUP (The Fix)
          echo "🔄 Stopping old services..."
          
          # A. Tell Systemd to stop managing them properly
          systemctl --user stop container-leadflow-backend || true
          systemctl --user stop container-leadflow-frontend || true
          systemctl --user reset-failed || true

          # B. Force delete containers
          podman rm -f leadflow-backend leadflow-frontend || true

          # C. CRITICAL: Kill any Zombie processes holding the ports
          # (This prevents "Address already in use" errors)
          sudo fuser -k 8000/tcp || true
          sudo fuser -k 3000/tcp || true
          
          # 5. DNS Fix (Critical for AWS/Fedora interaction)
          echo 'nameserver 8.8.8.8' > /tmp/resolv.conf.override

          # 6. Run BACKEND
          # REMOVED: --env-file (We use AWS SSM now)
          echo "🚀 Starting Backend..."
          podman run -d \
            --name leadflow-backend \
            --network host \
            -v /tmp/resolv.conf.override:/etc/resolv.conf:Z \
            --restart always \
            -e AWS_REGION=${{ env.AWS_REGION }} \
            -e APP_ENV=production \
            -v ~/leadflow-ai/storage:/app/storage:Z \
            -v ~/leadflow-ai/leads.db:/app/leads.db:Z \
            $IMG_BACKEND

          # 7. Run FRONTEND
          echo "🚀 Starting Frontend..."
          podman run -d \
            --name leadflow-frontend \
            --network host \
            -v /tmp/resolv.conf.override:/etc/resolv.conf:Z \
            --restart always \
            -e NEXT_PUBLIC_API_URL=https://my-leads.app \
            -e INTERNAL_API_URL=http://127.0.0.1:8000 \
            $IMG_FRONTEND

          # 8. Persistence (Systemd)
          mkdir -p ~/.config/systemd/user/
          podman generate systemd --new --files --name leadflow-backend > ~/.config/systemd/user/container-leadflow-backend.service
          podman generate systemd --new --files --name leadflow-frontend > ~/.config/systemd/user/container-leadflow-frontend.service
          systemctl --user daemon-reload
          systemctl --user enable --now container-leadflow-backend.service
          systemctl --user enable --now container-leadflow-frontend.service

          echo "✅ Deployment Successful!"
          EOF

      - name: Execute Deployment
        run: |
          scp deploy_script.sh production:~/deploy.sh
          ssh production "chmod +x ~/deploy.sh && ~/deploy.sh"
