# ==============================================================================
# ⚠️  CRITICAL CONFIGURATION WARNING ⚠️
# ==============================================================================
# Target Server OS: Amazon Linux 2023
# Container Runtime: PODMAN
# Architecture: Zero Trust (Cloudflare Tunnel)
#
# CRITICAL NOTE ON DEPLOYMENT LOGIC:
# The Cloudflare Tunnel runs as a SYSTEM service (container-cloudflared_host).
# This deployment script manages the APP service (leadflow-ai) as a USER service.
# We must NEVER stop the tunnel, or SSH access will be lost immediately.
# ==============================================================================

name: LeadFlow Production Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shay-mordechai/leadflow-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Configure SSH & Tunnel
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${{ secrets.CF_SSH_HOSTNAME }}
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_SERVICE_ID }} --secret ${{ secrets.CF_SERVICE_SECRET }}
          EOF

      - name: Create Podman Deployment Script
        # שינוי קריטי: הסרנו את הקוד שנוגע בטנל! הטנל מנוהל כעת ברמת השרת (Systemd) ולא צריך לגעת בו
        run: |
          cat <<EOF > deploy_script.sh
          #!/bin/bash
          set -e

          # Setup Variables
          NEW_TAG="${{ github.sha }}"
          APP_DIR=~/leadflow-ai

          # Ensure User Persistence
          sudo loginctl enable-linger ec2-user

          mkdir -p \$APP_DIR
          cd \$APP_DIR

          # 1. Fetch Secrets (Tunnel Token) from AWS SSM
          # This ensures that if the tunnel DOES crash, it has the token to restart
          echo "🔑 Fetching Cloudflare Token from AWS..."
          export CF_TOKEN=\$(aws ssm get-parameter --name "/leadflow/prod/CLOUDFLARE_TOKEN" --with-decryption --query "Parameter.Value" --output text)

          # 2. Login & Pull NEW specific version
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

          echo "⬇️ Pulling version: \$NEW_TAG"
          podman pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:\$NEW_TAG

          # 3. Deploy NEW Version (SURGICAL UPDATE)
          echo "🚀 Deploying version: \$NEW_TAG"
          export IMAGE_TAG=\$NEW_TAG

          # ⚠️ CRITICAL: DO NOT RUN 'podman-compose down'
          # We manually stop/remove ONLY the app container.
          # The 'tunnel' container stays alive to keep our SSH connection open.
          
          echo "🔄 Updating App Container..."
          podman stop leadflow-ai || true
          podman rm leadflow-ai || true
          
          # This brings up the app (recreating it) and ensures tunnel is running if it died
          podman-compose up -d

          # 4. Ensure Systemd Persistence (Boot Safety)
          # We regenerate the systemd files to match the current containers
          echo "🛡️ Configuring Auto-Start on Boot..."
          mkdir -p ~/.config/systemd/user/
          cd ~/.config/systemd/user/
          
          # Generate service files for both containers
          podman generate systemd --new --files --name leadflow-ai
          
          systemctl --user daemon-reload
          systemctl --user enable container-leadflow-ai.service
          systemctl --user enable container-cloudflared_tunnel.service
          
          cd \$APP_DIR

          # 4. Health Check
          echo '--- 🏥 Health Analysis (Waiting 15s) ---'
          sleep 15

          CONTAINER_ID=\$(podman ps -q --filter "name=leadflow" | head -n 1)

          if [ -z "\$CONTAINER_ID" ]; then
             echo '❌ CRITICAL: No container found running!'
             ROLLBACK_NEEDED=true
          else
             # Scan logs for fatal errors
             RECENT_LOGS=\$(podman logs --tail 100 \$CONTAINER_ID 2>&1)
             if echo "\$RECENT_LOGS" | grep -iqE 'exception|traceback|critical error|fatal|importerror'; then
                  echo '❌ CRITICAL: Error keywords detected in logs.'
                  echo "\$RECENT_LOGS" | grep -iE 'exception|traceback|critical error|fatal|importerror'
                  ROLLBACK_NEEDED=true
             else
                  echo '✅ Deployment Successful. Server is stable.'
             fi
          fi

          if [ "\$ROLLBACK_NEEDED" = "true" ]; then
              echo '⚠️ Health check failed.'
              # NOTE: We cannot easily rollback automatically without risking the tunnel.
              # We fail loud so you can fix it.
              exit 1
          fi

          # 5. Cleanup
          echo '--- 🧹 Cleaning up old images ---'
          podman image prune -f
          EOF

      - name: 🔍 Debug Connection
        run: |
          echo "Testing connection to Cloudflare..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_SERVICE_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_SERVICE_SECRET }}" \
            https://${{ secrets.CF_SSH_HOSTNAME }})

          echo "⚠️ SERVER RESPONSE CODE: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
             echo "❌ Connection check failed. Stopping."
             exit 1
          fi

      - name: Execute Deployment on Server
        run: |
          ssh production "mkdir -p ~/leadflow-ai"
          # Send the PROD compose file
          scp docker-compose.prod.yml production:~/leadflow-ai/docker-compose.yml
          scp deploy_script.sh production:~/leadflow-ai/deploy.sh
          ssh production "chmod +x ~/leadflow-ai/deploy.sh && ~/leadflow-ai/deploy.sh"
