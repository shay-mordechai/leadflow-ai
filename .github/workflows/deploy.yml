name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Professional Comment: Deploy script with Force Sync strategy
            cd ~/myleads
            
            # 1. Force sync with GitHub (Discards local manual changes/conflicts)
            git fetch --all
            git reset --hard origin/main
            
            # 2. Rebuild containers with new architecture
            # --remove-orphans: Cleans up old Redis/Celery containers if they exist
            docker-compose up -d --build --remove-orphans
            
            # 3. Cleanup to save disk space on EC2
            docker image prune -f
            
            echo "Deployment successful! System is live."
