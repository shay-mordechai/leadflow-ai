# ==============================================================================
# ⚠️  CRITICAL CONFIGURATION WARNING ⚠️
# ==============================================================================
# Target Server OS: Amazon Linux 2023
# Container Runtime: PODMAN
# Architecture: Zero Trust (Cloudflare Tunnel)
#
# CRITICAL NOTE ON DEPLOYMENT LOGIC:
# The Cloudflare Tunnel runs as a SYSTEM service (container-cloudflared_host).
# This deployment script manages the APP service (leadflow-ai) as a USER service.
# We must NEVER stop the tunnel, or SSH access will be lost immediately.
# ==============================================================================
# --- JOB 4: DEPLOY ---
  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      # --- 1. SETUP SSH TUNNEL (CLOUDFLARE) ---
      - name: Setup SSH & Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          mkdir -p ~/.ssh/
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${{ secrets.CF_SSH_HOSTNAME }}
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h --id ${{ secrets.CF_SERVICE_ID }} --secret ${{ secrets.CF_SERVICE_SECRET }}
          EOF

      # --- 2. GENERATE DEPLOY SCRIPT ---
      - name: Generate Deploy Script
        run: |
          cat <<'EOF' > deploy.sh
          #!/bin/bash
          set -e
          
          # Variables
          BACKEND_IMG="${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest"
          FRONTEND_IMG="${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest"
          SYSTEMD_DIR="$HOME/.config/systemd/user"
          
          echo "🚀 Starting Deployment on Production..."
          
          # 1. Login & Pull
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          podman pull "$BACKEND_IMG"
          podman pull "$FRONTEND_IMG"
          
          # 2. Stop & Clean Old State
          echo "🛑 Stopping old services..."
          systemctl --user stop container-leadflow-backend 2>/dev/null || true
          systemctl --user stop container-leadflow-frontend 2>/dev/null || true
          podman rm -f leadflow-backend leadflow-frontend 2>/dev/null || true
          
          # 3. Create Directories
          mkdir -p ~/leadflow-ai/storage
          mkdir -p "$SYSTEMD_DIR"
          
          # 4. Run Containers (To create them)
          echo "🔥 Creating Containers..."
          
          # Backend
          podman run -d \
            --name leadflow-backend \
            --network host \
            --replace \
            --env APP_ENV=production \
            --env AWS_REGION=${{ env.AWS_REGION }} \
            -v ~/leadflow-ai/storage:/app/storage:Z \
            -v ~/leadflow-ai/leads.db:/app/leads.db:Z \
            "$BACKEND_IMG"

          # Frontend
          podman run -d \
            --name leadflow-frontend \
            --network host \
            --replace \
            --env NEXT_PUBLIC_API_URL=https://my-leads.app \
            "$FRONTEND_IMG"
            
          # 5. STOP Containers (Critical Step!)
          # We stop them so Systemd can take over via 'ExecStart=podman start'
          echo "⏸️  Handing over to Systemd..."
          podman stop leadflow-backend
          podman stop leadflow-frontend
            
          # 6. Generate Systemd Services
          echo "⚙️ Generating Systemd Files..."
          cd "$SYSTEMD_DIR"
          
          # Backend Service File
          cat <<SERVICE > container-leadflow-backend.service
          [Unit]
          Description=LeadFlow Backend Container
          After=network-online.target
          
          [Service]
          Restart=always
          ExecStart=/usr/bin/podman start -a leadflow-backend
          ExecStop=/usr/bin/podman stop -t 10 leadflow-backend
          KillMode=control-group
          
          [Install]
          WantedBy=default.target
          SERVICE
          
          # Frontend Service File
          cat <<SERVICE > container-leadflow-frontend.service
          [Unit]
          Description=LeadFlow Frontend Container
          After=network-online.target
          
          [Service]
          Restart=always
          ExecStart=/usr/bin/podman start -a leadflow-frontend
          ExecStop=/usr/bin/podman stop -t 10 leadflow-frontend
          KillMode=control-group
          
          [Install]
          WantedBy=default.target
          SERVICE
          
          # 7. Enable & Start via Systemd
          echo "🔄 Reloading Systemd..."
          systemctl --user daemon-reload
          systemctl --user enable --now container-leadflow-backend.service
          systemctl --user enable --now container-leadflow-frontend.service
          
          # 8. Verify
          echo "✅ Deployment Complete! Status:"
          sleep 3
          systemctl --user status container-leadflow-backend --no-pager
          EOF

      # --- 3. EXECUTE ---
      - name: Execute on Production
        run: |
          chmod +x deploy.sh
          scp deploy.sh production:~/deploy.sh
          ssh production "~/deploy.sh"