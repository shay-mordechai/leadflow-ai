name: LeadFlow Production Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shay-mordechai/leadflow-ai 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Tagging with both :latest and the unique commit SHA for rollback capability
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Login to Registry
            echo ${{ secrets.GITHUB_TOKEN }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ~/leadflow-ai
            
            # 2. Identify current image for potential rollback
            PREVIOUS_IMAGE=$(podman inspect leadflow_app --format '{{.Config.Image}}' || echo "")
            NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

            # 3. Deployment & Health Check Function
            deploy_and_check() {
              local img=$1
              echo "Attempting to deploy image: $img"
              
              # Pull and replace app container
              podman pull $img
              podman run --name leadflow_app \
                --replace --pod leadflow-pod --env-file .env \
                -v ./storage:/app/storage:Z -d $img \
                gunicorn src.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

              # Wait 15 seconds to ensure the app doesn't crash on startup
              sleep 15
              STATUS=$(podman inspect leadflow_app --format '{{.State.Status}}')
              
              if [ "$STATUS" != "running" ]; then
                echo "❌ Container failed to stay running (Status: $STATUS)"
                return 1
              fi
              return 0
            }

            # 4. Main Deployment Logic
            if deploy_and_check $NEW_IMAGE; then
              echo "✅ New version is stable. Updating Worker and Tunnel..."
              
              # Update Worker with the SAME image tag
              podman run --name leadflow_worker --replace --pod leadflow-pod --env-file .env \
                -e PYTHONPATH=/app --workdir /app -v ./storage:/app/storage:Z -d $NEW_IMAGE \
                python -m src.worker
                
              # Ensure Cloudflared is connected to the pod network
              source .env
              podman run --name cloudflared --replace --pod leadflow-pod --env-file .env \
                -d docker.io/cloudflare/cloudflared:latest \
                tunnel --no-autoupdate run --token $CLOUDFLARE_TOKEN
                
              podman image prune -f
              echo "🚀 Deployment successful!"
            else
              echo "⚠️ HEALTH CHECK FAILED! STARTING ROLLBACK..."
              if [ ! -z "$PREVIOUS_IMAGE" ] && [ "$PREVIOUS_IMAGE" != "$NEW_IMAGE" ]; then
                deploy_and_check $PREVIOUS_IMAGE
                echo "⏪ Successfully rolled back to $PREVIOUS_IMAGE"
              else
                echo "❌ Rollback failed: No previous stable image found."
              fi
              exit 1 # Fail the action so developer is notified
            fi