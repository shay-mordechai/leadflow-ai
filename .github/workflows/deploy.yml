name: LeadFlow Professional Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # This creates the tag: ghcr.io/shay-mordechai/leadflow-ai:latest
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/myleads

            # 1. Update server files
            git pull origin main

            # 2. Login to Registry
            echo ${{ secrets.GITHUB_TOKEN }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3. Pull the NEW LeadFlow image
            podman pull ghcr.io/${{ github.repository }}:latest

            # 4. Refresh containers (Recreates leadflow_app with new image)
            podman-compose up -d

            # 5. Cleanup (Anti-Sha'ariyot)
            podman image prune -a -f

            echo "LeadFlow deployed successfully!"
