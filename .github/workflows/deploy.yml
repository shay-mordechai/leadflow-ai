# ==============================================================================
# ⚠️  CRITICAL CONFIGURATION WARNING ⚠️
# ==============================================================================
# Target Server OS: Amazon Linux 2023
# Container Runtime: PODMAN
# Architecture: Zero Trust (Cloudflare Tunnel)
#
# CRITICAL NOTE ON DEPLOYMENT LOGIC:
# The Cloudflare Tunnel runs as a SYSTEM service (container-cloudflared_host).
# This deployment script manages the APP service (leadflow-ai) as a USER service.
# We must NEVER stop the tunnel, or SSH access will be lost immediately.
# ==============================================================================
name: LeadFlow Production Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: shay-mordechai/leadflow-backend
  IMAGE_FRONTEND: shay-mordechai/leadflow-frontend
  AWS_REGION: eu-north-1

jobs:
  # --- JOB 1: RUN TESTS ---
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx sqlalchemy fastapi passlib python-jose multipart

      - name: Run Pytest
        env:
          PYTHONPATH: .
          APP_ENV: "testing"
          SECRET_KEY: "testing_secret_key_123"
          DATABASE_URL: "sqlite:///:memory:"
          AWS_REGION: "eu-north-1"
        run: |
          if [ -f "tests/test_flow.py" ]; then
            pytest tests/test_flow.py -v
          else
            echo "⚠️ Test file not found! Skipping tests."
          fi

  # --- JOB 2: BUILD BACKEND ---
  build-backend:
    needs: [test-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest

  # --- JOB 3: BUILD FRONTEND ---
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest

  # --- JOB 4: DEPLOY ---
  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      # --- 1. SETUP SSH TUNNEL (CLOUDFLARE) ---
      - name: Setup SSH & Cloudflared
        run: |
          # Install Cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          # Setup SSH Key
          mkdir -p ~/.ssh/
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Configure SSH Config
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${{ secrets.CF_SSH_HOSTNAME }}
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h --id ${{ secrets.CF_SERVICE_ID }} --secret ${{ secrets.CF_SERVICE_SECRET }}
          EOF

      # --- 2. GENERATE DEPLOY SCRIPT ---
      - name: Generate Deploy Script
        run: |
          cat <<'EOF' > deploy.sh
          #!/bin/bash
          set -e
          
          # Variables
          BACKEND_IMG="${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest"
          FRONTEND_IMG="${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest"
          SYSTEMD_DIR="$HOME/.config/systemd/user"
          
          echo "🚀 Starting Deployment on Production..."
          
          # 1. Login to Registry
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # 2. Pull Latest Images
          echo "⬇️ Pulling latest images..."
          podman pull "$BACKEND_IMG"
          podman pull "$FRONTEND_IMG"
          
          # 3. Stop Old Services (Gracefully)
          echo "🛑 Stopping old services..."
          systemctl --user stop container-leadflow-backend 2>/dev/null || true
          systemctl --user stop container-leadflow-frontend 2>/dev/null || true
          podman rm -f leadflow-backend leadflow-frontend 2>/dev/null || true
          
          # 4. Prepare Directories
          mkdir -p ~/leadflow-ai/storage
          mkdir -p "$SYSTEMD_DIR"
          
          # 5. Run Backend Container
          echo "🔥 Starting Backend..."
          podman run -d \
            --name leadflow-backend \
            --network host \
            --env APP_ENV=production \
            --env AWS_REGION=${{ env.AWS_REGION }} \
            -v ~/leadflow-ai/storage:/app/storage:Z \
            -v ~/leadflow-ai/leads.db:/app/leads.db:Z \
            "$BACKEND_IMG"
            
          # 6. Run Frontend Container
          echo "🔥 Starting Frontend..."
          podman run -d \
            --name leadflow-frontend \
            --network host \
            --env NEXT_PUBLIC_API_URL=https://my-leads.app \
            "$FRONTEND_IMG"
            
          # 7. Generate Systemd Services (MANUALLY FIXING THE ISSUE)
          echo "⚙️ Generating Systemd Services..."
          cd "$SYSTEMD_DIR"
          
          # Backend Service
          cat <<SERVICE > container-leadflow-backend.service
          [Unit]
          Description=LeadFlow Backend Container
          After=network-online.target
          
          [Service]
          Restart=always
          ExecStart=/usr/bin/podman start -a leadflow-backend
          ExecStop=/usr/bin/podman stop -t 10 leadflow-backend
          KillMode=control-group
          
          [Install]
          WantedBy=default.target
          SERVICE
          
          # Frontend Service
          cat <<SERVICE > container-leadflow-frontend.service
          [Unit]
          Description=LeadFlow Frontend Container
          After=network-online.target
          
          [Service]
          Restart=always
          ExecStart=/usr/bin/podman start -a leadflow-frontend
          ExecStop=/usr/bin/podman stop -t 10 leadflow-frontend
          KillMode=control-group
          
          [Install]
          WantedBy=default.target
          SERVICE
          
          # 8. Reload & Enable
          echo "🔄 Reloading Systemd..."
          systemctl --user daemon-reload
          systemctl --user enable --now container-leadflow-backend.service
          systemctl --user enable --now container-leadflow-frontend.service
          
          # 9. Health Check
          echo "✅ Deployment Complete! Checking status..."
          sleep 5
          systemctl --user status container-leadflow-backend --no-pager
          EOF

      # --- 3. EXECUTE DEPLOYMENT ---
      - name: Execute on Production
        run: |
          chmod +x deploy.sh
          scp deploy.sh production:~/deploy.sh
          ssh production "~/deploy.sh"