name: Deploy to EC2 (Podman)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Professional Comment: Deploy using Podman
            cd ~/myleads
            
            # 1. Force sync with GitHub
            git fetch --all
            git reset --hard origin/main
            
            # 2. Ensure podman-compose is installed
            if ! command -v podman-compose &> /dev/null; then
                pip3 install podman-compose
            fi
            
            # 3. Build and Run using Podman
            # Note: Podman handles orphans differently, so standard up --build is usually enough
            podman-compose up -d --build
            
            # 4. Cleanup
            podman image prune -f
            
            echo "Deployment successful with Podman!"
