name: LeadFlow Professional Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Login to Registry
            echo ${{ secrets.GITHUB_TOKEN }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Pull the NEW image
            podman pull ghcr.io/${{ github.repository }}:latest

            # -------------------------------------------
            # 3. Stop OLD Containers
            # -------------------------------------------
            podman stop leadflow_app leadflow_worker || true
            podman rm leadflow_app leadflow_worker || true

            # -------------------------------------------
            # 4. Run APP (Web Server)
            # -------------------------------------------
            podman run --name leadflow_app \
              --pod leadflow-pod \
              --dns 8.8.8.8 \
              --env-file ~/leadflow-ai/.env \
              -v ~/leadflow-ai/storage:/app/storage:Z \
              -d ghcr.io/${{ github.repository }}:latest \
              gunicorn src.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 120

            # -------------------------------------------
            # 5. Run WORKER (Transcriber) - SAME Image, DIFFERENT Command
            # -------------------------------------------
            podman run --name leadflow_worker \
              --pod leadflow-pod \
              --dns 8.8.8.8 \
              --env-file ~/leadflow-ai/.env \
              -v ~/leadflow-ai/storage:/app/storage:Z \
              -d ghcr.io/${{ github.repository }}:latest \
              python src/worker.py

            # 6. Cleanup
            podman image prune -f

            echo "🚀 LeadFlow (App + Worker) deployed successfully!"