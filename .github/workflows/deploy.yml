name: LeadFlow Production Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shay-mordechai/leadflow-ai

jobs:
  # JOB 1: Build Docker Image & Push to Registry
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # JOB 2: Connect to EC2 & Restart Services (Podman Version)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Login to GitHub Registry (using Podman)
            echo ${{ secrets.GITHUB_TOKEN }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Navigate to project directory and pull git changes
            cd ~/leadflow-ai
            git pull origin main

            # 3. Pull the NEW Image
            podman pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # 4. Restart APP (Website)
            # --replace automatically removes the old container
            podman run --name leadflow_app \
              --replace \
              --pod leadflow-pod \
              --env-file .env \
              -v ./storage:/app/storage:Z \
              -d ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              gunicorn src.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

            # 5. Restart WORKER (Transcription & AI) - CRITICAL FIX INCLUDED
            podman run --name leadflow_worker \
              --replace \
              --pod leadflow-pod \
              --env-file .env \
              --workdir /app \
              -v ./storage:/app/storage:Z \
              -d ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              python -m src.worker

            # 6. Ensure Cloudflared is running (Just in case)
            # We use the token from the .env file
            source .env
            podman run --name cloudflared \
              --replace \
              --pod leadflow-pod \
              --env-file .env \
              -d docker.io/cloudflare/cloudflared:latest \
              tunnel --no-autoupdate run --token $CLOUDFLARE_TOKEN

            # 7. Cleanup old images
            podman image prune -f
            
            echo "✅ Deployment Successful! App and Worker are running properly."