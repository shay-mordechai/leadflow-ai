name: LeadFlow Production Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shay-mordechai/leadflow-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 1. Install Cloudflared on the GitHub Runner
      # This is required to establish the tunnel connection using the ProxyCommand
      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      # 2. Configure SSH Client
      # We create the SSH directory, save the private key, and configure the ~/.ssh/config file
      # to use 'cloudflared' as a ProxyCommand. This bypasses the need for an open port 22.
      - name: Configure SSH & Tunnel
        run: |
          mkdir -p ~/.ssh/
          
          # Write the private key to a file and secure it
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Create the SSH Config file
          # We define a host alias 'production' that uses the Cloudflare Service Token for auth
          cat >> ~/.ssh/config <<EOF
          Host production
            HostName ${{ secrets.CF_SSH_HOSTNAME }}
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_SERVICE_ID }} --secret ${{ secrets.CF_SERVICE_SECRET }}
          EOF

      # 3. Execute Remote Deployment
      # We connect to 'production' (defined above) and run the deployment commands
      - name: Execute Remote Deployment
        run: |
          ssh production "
            set -e
            
            # Login to GHCR so we can pull the private image
            echo ${{ secrets.GITHUB_TOKEN }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Navigate to project directory
            cd ~/leadflow-ai
            
            # Ensure the deployment script is executable and run it
            chmod +x deploy.sh
            ./deploy.sh
          "