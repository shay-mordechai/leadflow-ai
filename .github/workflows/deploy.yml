name: LeadFlow Production Deploy

on:
  push:
    branches: [ main ]

env:
  # GitHub Container Registry Configuration
  REGISTRY: ghcr.io
  # TODO: Ensure this matches your GitHub username/repo (lowercase)
  IMAGE_NAME: shay-mordechai/leadflow-ai 

jobs:
  # JOB 1: Build Docker Image & Push to Registry
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # JOB 2: Connect to EC2 & Restart Services
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Login to GitHub Registry on the server
            # This allows the server to pull private images
            echo ${{ secrets.GITHUB_TOKEN }} | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Navigate to project directory
            cd leadflow-ai

            # 3. Pull latest git changes (to update docker-compose.yaml if needed)
            git pull origin main

            # 4. Pull the NEW Docker image we just built
            sudo docker-compose pull

            # 5. Restart containers using the new image
            # 'up -d' recreates containers only if the image changed
            sudo docker-compose up -d

            # 6. Cleanup: Remove unused images to save disk space
            sudo docker system prune -f
            
            echo "✅ Deployment Successful! System is live."