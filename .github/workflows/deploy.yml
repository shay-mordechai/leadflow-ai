# .github/workflows/deploy.yml
# ==============================================================================
# ⚠️  CRITICAL CONFIGURATION WARNING - READ BEFORE EDITING  ⚠️
# ==============================================================================
# Target Server OS: Amazon Linux 2023
# Container Runtime: PODMAN (Not Docker!)
#
# IMPORTANT:
# This workflow is specifically tuned for PODMAN.
# - Do NOT change 'podman' commands back to 'docker'.
# - Do NOT change 'podman-compose' back to 'docker compose'.
#
# The EC2 server uses Podman which is daemonless and rootless by design.
# ==============================================================================

name: LeadFlow Production Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shay-mordechai/leadflow-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Configure SSH & Tunnel
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${{ secrets.CF_SSH_HOSTNAME }}
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_SERVICE_ID }} --secret ${{ secrets.CF_SERVICE_SECRET }}
          EOF

      - name: Create Podman Deployment Script
        run: |
          cat <<EOF > deploy_script.sh
          #!/bin/bash
          set -e

          # Setup Variables
          NEW_TAG="${{ github.sha }}"
          APP_DIR=~/leadflow-ai

          mkdir -p \$APP_DIR
          cd \$APP_DIR

          # 1. Capture CURRENT running version (for Rollback)
          # We check which image ID is currently running leadflow-ai
          PREV_IMAGE_ID=\$(podman inspect --format '{{.Image}}' leadflow-ai 2>/dev/null || echo "")
          echo "🔎 Current Image ID: \$PREV_IMAGE_ID"

          # 2. Login & Pull NEW specific version
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

          echo "⬇️ Pulling version: \$NEW_TAG"
          podman pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:\$NEW_TAG

          # 3. Deploy NEW Version
          echo "🚀 Deploying version: \$NEW_TAG"

          # We pass the specific tag to docker-compose via env var
          export IMAGE_TAG=\$NEW_TAG

          podman-compose down || true
          podman-compose up -d

          # 4. Health Check & Rollback Logic
          echo '--- 🏥 Health Analysis (Waiting 15s) ---'
          sleep 15

          ROLLBACK_NEEDED=false
          CONTAINER_ID=\$(podman ps -q --filter "name=leadflow" | head -n 1)

          if [ -z "\$CONTAINER_ID" ]; then
             echo '❌ CRITICAL: No container found running!'
             ROLLBACK_NEEDED=true
          else
             # Scan logs for fatal errors
             RECENT_LOGS=\$(podman logs --tail 100 \$CONTAINER_ID 2>&1)
             if echo "\$RECENT_LOGS" | grep -iqE 'exception|traceback|critical error|fatal|importerror'; then
                  echo '❌ CRITICAL: Error keywords detected in logs.'
                  echo "\$RECENT_LOGS" | grep -iE 'exception|traceback|critical error|fatal|importerror'
                  ROLLBACK_NEEDED=true
             else
                  echo '✅ Deployment Successful. Server is stable on version: ' \$NEW_TAG
             fi
          fi

          # 5. Execute Rollback if needed
          if [ "\$ROLLBACK_NEEDED" = "true" ]; then
              echo '⚠️ Health check failed. Initiating Rollback...'

              # Stop the bad container
              podman-compose down

              if [ -n "\$PREV_IMAGE_ID" ]; then
                  echo "🔄 Rolling back to previous Image ID: \$PREV_IMAGE_ID"
                  # We force the compose to run with the specific Image ID that worked before
                  # Note: This works because Podman/Docker can accept Image ID as the tag source in some contexts,
                  # but to be safe with Compose, we might need to rely on 'latest' if we don't know the old SHA.
                  # FALLBACK STRATEGY: Revert to 'latest' (which usually points to the last successful build,
                  # but in this pipeline 'latest' was just updated too).

                  # BETTER STRATEGY: Just fail loud.
                  # Since 'latest' is already overwritten in the registry, we can't easily fetch the "previous" tag
                  # unless we stored it.

                  echo "❌ Automated rollback is limited because 'latest' tag was overwritten."
                  echo "👉 Please manually revert the commit in GitHub."
                  exit 1
              else
                  echo "❌ No previous version found to rollback to."
                  exit 1
              fi
          fi

          # 6. Cleanup (Only if success)
          echo '--- 🧹 Cleaning up old images ---'
          # Keep only the last 2 versions to save space but allow manual rollback
          podman image prune -f
          EOF

      - name: Execute Deployment on Server
        run: |
          ssh production "mkdir -p ~/leadflow-ai"
          # Send the PROD compose file (which now supports IMAGE_TAG env var)
          scp docker-compose.prod.yml production:~/leadflow-ai/docker-compose.yml
          scp deploy_script.sh production:~/leadflow-ai/deploy.sh
          ssh production "chmod +x ~/leadflow-ai/deploy.sh && ~/leadflow-ai/deploy.sh"
