name: LeadFlow Production Deploy

on:
  push:
    branches: [ main ]

env:
  # GitHub Container Registry Configuration
  REGISTRY: ghcr.io
  # Ensure this matches your GitHub username/repo (lowercase)
  IMAGE_NAME: shay-mordechai/leadflow-ai 

jobs:
  # JOB 1: Build Docker Image & Push to Registry
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # JOB 2: Connect to EC2 & Restart Services (Podman Version)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Login to GitHub Registry on the server
            echo ${{ secrets.GITHUB_TOKEN }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Navigate to project directory
            cd ~/leadflow-ai

            # 3. Pull latest git changes (to ensure scripts are up to date)
            git pull origin main

            # 4. Pull the NEW Docker image
            podman pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # 5. Restart APP (Website)
            # --replace automatically removes the old container if it exists
            podman run --name leadflow_app \
              --replace \
              --pod leadflow-pod \
              --env-file .env \
              -v ./storage:/app/storage:Z \
              -d ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              gunicorn src.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

            # 6. Restart WORKER (Transcription & AI)
            # We add PYTHONPATH=/app to ensure Python finds the 'src' module correctly
            podman run --name leadflow_worker \
              --replace \
              --pod leadflow-pod \
              --env-file .env \
              -e PYTHONPATH=/app \
              --workdir /app \
              -v ./storage:/app/storage:Z \
              -d ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              python -m src.worker

            # 7. Ensure Cloudflared is running
            # We source .env to get the CLOUDFLARE_TOKEN variable
            source .env
            podman run --name cloudflared \
              --replace \
              --pod leadflow-pod \
              --env-file .env \
              -d docker.io/cloudflare/cloudflared:latest \
              tunnel --no-autoupdate run --token $CLOUDFLARE_TOKEN

            # 8. Cleanup: Remove unused images to save disk space
            podman image prune -f
            
            echo "✅ Deployment Successful! System is live."
