name: LeadFlow Production Deploy (GHCR & Hetzner)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'scripts/**'
      - 'frontend/**'
      - 'data-gate/**'
      - 'compose.yaml'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.gitleaks.toml'
      - '.github/workflows/production.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      datagate: ${{ steps.filter.outputs.datagate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'alembic/**'
              - 'alembic.ini'
              - 'scripts/**'
              - 'Dockerfile'
              - 'requirements.txt'
              - 'compose.yaml'
              - '.gitleaks.toml'
            frontend:
              - 'frontend/**'
            datagate:
              - 'data-gate/**'

  security-and-test-gates:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan repository filesystem and dependencies (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Setup Python 3.12
        if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies and test scanners
        if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff bandit pip-audit pytest pytest-asyncio pytest-mock

      - name: Run Linter (Ruff)
        if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run Bandit SAST
        if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        run: bandit -r src/ -ll -ii

      - name: Run Pip Audit SCA
        if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        run: pip-audit -r requirements.txt

      - name: Run Tests Verification Gate
        if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        env:
          PYTHONPATH: "."
          ENVIRONMENT: "test"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          GOOGLE_API_KEY: "dummy_google_api_key_for_tests_only"
        run: pytest tests/ -q

  build-and-push:
    needs: [ detect-changes, security-and-test-gates ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        id: string_transform
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ env.IMAGE_NAME }}

      - name: Install Rust Toolchain (WASM)
        if: needs.detect-changes.outputs.datagate == 'true' || github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM Filter
        if: needs.detect-changes.outputs.datagate == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ./data-gate
        env:
          RUSTFLAGS: "-C link-arg=--allow-undefined"
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          LOWER_REPO=${{ steps.string_transform.outputs.lowercase }}
          docker build --build-arg CURRENT_IMAGE_SHA=${{ github.sha }} -t ${{ env.REGISTRY }}/${LOWER_REPO}/leadflow-backend:latest .
          docker push ${{ env.REGISTRY }}/${LOWER_REPO}/leadflow-backend:latest

      - name: Build and Push Frontend Image
        if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ./frontend
        run: |
          LOWER_REPO=${{ steps.string_transform.outputs.lowercase }}
          docker build -t ${{ env.REGISTRY }}/${LOWER_REPO}/leadflow-frontend:latest .
          docker push ${{ env.REGISTRY }}/${LOWER_REPO}/leadflow-frontend:latest

      - name: Build and Push Data Gate Image
        if: needs.detect-changes.outputs.datagate == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ./data-gate
        run: |
          LOWER_REPO=${{ steps.string_transform.outputs.lowercase }}
          docker build -t ${{ env.REGISTRY }}/${LOWER_REPO}/leadflow-data-gate:latest .
          docker push ${{ env.REGISTRY }}/${LOWER_REPO}/leadflow-data-gate:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook Deployment
        run: |
          curl -f -X POST "https://deploy.my-leads.app/hooks/deploy-leadflow" \
               -H "X-Deploy-Token: ${{ secrets.WEBHOOK_DEPLOY_TOKEN }}"
          echo "✅ Webhook trigger sent successfully to Hetzner!"