name: LeadFlow Production Deploy (GHCR & Hetzner)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'data-gate/**'
      - 'compose.yaml'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/production.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      datagate: ${{ steps.filter.outputs.datagate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'Dockerfile'
              - 'requirements.txt'
            frontend:
              - 'frontend/**'
            datagate:
              - 'data-gate/**'

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (WASM)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM Filter
        working-directory: ./data-gate
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          IMAGE_URL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/leadflow-backend:latest"
          docker build -t "$IMAGE_URL" .
          docker push "$IMAGE_URL"

      - name: Build and Push Frontend Image
        working-directory: ./frontend
        run: |
          IMAGE_URL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/leadflow-frontend:latest"
          docker build -t "$IMAGE_URL" .
          docker push "$IMAGE_URL"

      - name: Build and Push Data Gate Image
        working-directory: ./data-gate
        run: |
          IMAGE_URL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/leadflow-data-gate:latest"
          docker build -t "$IMAGE_URL" .
          docker push "$IMAGE_URL"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner CX23 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deployer
          key: ${{ secrets.HETZNER_DEPLOY_KEY }}
          script: |
            mkdir -p ~/app/data ~/app/storage
            
            cat << 'EOF' > ~/app/.env.production
            APP_ENV=production
            DATABASE_URL=sqlite:////app/data/leads.db
            REDIS_URL=redis://127.0.0.1:6379/0
            SECRET_KEY=${{ secrets.PRODUCTION_SECRET_KEY }}
            ENABLE_AWS_SSM=false
            BASE_URL=${{ secrets.PRODUCTION_BASE_URL }}
            ADMIN_EMAIL=${{ secrets.PRODUCTION_ADMIN_EMAIL }}
            EOF

            chmod 600 ~/app/.env.production

            cd ~/app
            git pull origin main
            podman compose pull
            podman compose up -d --remove-orphans
            podman image prune -a -f
            echo "✅ Deployment completed successfully!"