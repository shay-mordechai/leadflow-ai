name: LeadFlow Production Deploy (GHCR & Hetzner)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'data-gate/**'
      - 'compose.yaml'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/production.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      datagate: ${{ steps.filter.outputs.datagate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'Dockerfile'
              - 'requirements.txt'
            frontend:
              - 'frontend/**'
            datagate:
              - 'data-gate/**'

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (WASM)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM Filter
        working-directory: ./data-gate
        env:
          RUSTFLAGS: "-C link-arg=--allow-undefined"
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          docker build -t \({{ env.REGISTRY }}/\){{ env.IMAGE_NAME }}/leadflow-backend:latest .
          docker push \({{ env.REGISTRY }}/\){{ env.IMAGE_NAME }}/leadflow-backend:latest

      - name: Build and Push Frontend Image
        working-directory: ./frontend
        run: |
          docker build -t \({{ env.REGISTRY }}/\){{ env.IMAGE_NAME }}/leadflow-frontend:latest .
          docker push \({{ env.REGISTRY }}/\){{ env.IMAGE_NAME }}/leadflow-frontend:latest

      - name: Build and Push Data Gate Image
        working-directory: ./data-gate
        run: |
          docker build -t \({{ env.REGISTRY }}/\){{ env.IMAGE_NAME }}/leadflow-data-gate:latest .
          docker push \({{ env.REGISTRY }}/\){{ env.IMAGE_NAME }}/leadflow-data-gate:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook Deployment
        run: |
          curl -f -X POST "https://deploy.my-leads.app/hooks/deploy-leadflow" \
               -H "X-Deploy-Token: ${{ secrets.WEBHOOK_DEPLOY_TOKEN }}"
          echo "✅ Webhook trigger sent successfully!"
