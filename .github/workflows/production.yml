# ==============================================================================
# ⚠️  CRITICAL CONFIGURATION WARNING ⚠️
# ==============================================================================
# Target Server OS: Amazon Linux 2023
# Container Runtime: PODMAN
# Architecture: Zero Trust (Cloudflare Tunnel)
# ==============================================================================
name: LeadFlow Production Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: shay-mordechai/leadflow-backend
  IMAGE_FRONTEND: shay-mordechai/leadflow-frontend
  AWS_REGION: eu-north-1

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<70" wheel
          if [ -f requirements.txt ]; then pip install --no-build-isolation -r requirements.txt; fi
          pip install pytest httpx sqlalchemy fastapi passlib python-jose python-multipart

      - name: Run Pytest
        env:
          PYTHONPATH: .
          APP_ENV: "testing"
          SECRET_KEY: "testing_secret_key_123"
          DATABASE_URL: "sqlite:///:memory:"
          AWS_REGION: "eu-north-1"
        run: |
          if [ -f "tests/test_flow.py" ]; then
            pytest tests/test_flow.py -v
          else
            echo "⚠️ Test file not found! Skipping tests."
          fi

  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Log in to Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Log in to Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest

  deploy:
    needs: [test-backend, build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH & Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          mkdir -p ~/.ssh/
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${{ secrets.CF_SSH_HOSTNAME }}
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h --id ${{ secrets.CF_SERVICE_ID }} --secret ${{ secrets.CF_SERVICE_SECRET }}
          EOF

      - name: Generate Deploy Script
        run: |
          cat <<'EOF' > deploy.sh
          #!/bin/bash
          set -e
          
          BACKEND_IMG="${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest"
          FRONTEND_IMG="${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest"
          SYSTEMD_DIR="$HOME/.config/systemd/user"
          
          echo "🚀 Starting Deployment on Production..."
          
          # 1. Stop & Clean Old State (Free up disk space)
          systemctl --user stop container-leadflow-backend 2>/dev/null || true
          systemctl --user stop container-leadflow-frontend 2>/dev/null || true
          podman rm -f leadflow-backend leadflow-frontend 2>/dev/null || true
          podman system prune -a -f
          
          # 2. Login & Pull
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          podman pull "$BACKEND_IMG"
          podman pull "$FRONTEND_IMG"
          
          # 3. Setup Persistence
          mkdir -p ~/leadflow-ai/storage
          mkdir -p ~/leadflow-ai/data
          mkdir -p "$SYSTEMD_DIR"
          
          # 4. Run Containers
          # FIX: Enforced absolute path for DATABASE_URL to ensure Volume usage
          # FIX: Explicitly set 1 worker to prevent 'Table already exists' during Startup
          podman run -d \
            --name leadflow-backend \
            --network host \
            --replace \
            --env APP_ENV=production \
            --env AWS_REGION=${{ env.AWS_REGION }} \
            --env DATABASE_URL=sqlite:////app/data/leads.db \
            -v ~/leadflow-ai/storage:/app/storage:Z \
            -v ~/leadflow-ai/data:/app/data:Z \
            "$BACKEND_IMG" \
            gunicorn src.main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

          podman run -d \
            --name leadflow-frontend \
            --network host \
            --replace \
            --env NEXT_PUBLIC_API_URL=https://my-leads.app \
            "$FRONTEND_IMG"
            
          podman stop leadflow-backend leadflow-frontend
            
          # 5. Generate/Update Systemd Files
          cd "$SYSTEMD_DIR"
          cat <<SERVICE > container-leadflow-backend.service
          [Unit]
          Description=LeadFlow Backend Container
          [Service]
          Restart=always
          ExecStart=/usr/bin/podman start -a leadflow-backend
          ExecStop=/usr/bin/podman stop -t 10 leadflow-backend
          [Install]
          WantedBy=default.target
          SERVICE
          
          cat <<SERVICE > container-leadflow-frontend.service
          [Unit]
          Description=LeadFlow Frontend Container
          [Service]
          Restart=always
          ExecStart=/usr/bin/podman start -a leadflow-frontend
          ExecStop=/usr/bin/podman stop -t 10 leadflow-frontend
          [Install]
          WantedBy=default.target
          SERVICE
          
          systemctl --user daemon-reload
          systemctl --user enable --now container-leadflow-backend.service
          systemctl --user enable --now container-leadflow-frontend.service
          
          echo "✅ Deployment Complete!"
          EOF

      - name: Execute on Production
        run: |
          chmod +x deploy.sh
          scp deploy.sh production:~/deploy.sh
          ssh production "~/deploy.sh"