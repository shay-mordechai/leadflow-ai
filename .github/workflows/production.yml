name: LeadFlow Production Deploy (GHCR & Hetzner)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'data-gate/**'
      - 'compose.yaml'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/production.yml'

env:
  REGISTRY: ghcr.io
  # Convert repository owner to lowercase to prevent GHCR push errors
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  security-scans:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan repository dependencies and filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          exit-code: "1"
          severity: CRITICAL,HIGH

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      datagate: ${{ steps.filter.outputs.datagate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'Dockerfile'
              - 'requirements.txt'
              - 'compose.yaml'
            frontend:
              - 'frontend/**'
            datagate:
              - 'data-gate/**'

  build-and-push:
    needs: [ detect-changes, security-scans ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        id: string_transform
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ env.IMAGE_NAME }}

      - name: Install Rust Toolchain (WASM)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM Filter
        working-directory: ./data-gate
        env:
          RUSTFLAGS: "-C link-arg=--allow-undefined"
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          LOWER_REPO=${{ steps.string_transform.outputs.lowercase }}
          docker build -t ${{ env.REGISTRY }}/${LOWER_REPO}/leadflow-backend:latest .
          docker push ${{ env.REGISTRY }}/${LOWER_REPO}/leadflow-backend:latest

      - name: Build and Push Frontend Image
        if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ./frontend
        run: |
          LOWER_REPO=${{ steps.string_transform.outputs.lowercase }}
          docker build -t ${{ env.REGISTRY }}/${LOWER_REPO}/leadflow-frontend:latest .
          docker push ${{ env.REGISTRY }}/${LOWER_REPO}/leadflow-frontend:latest

      - name: Build and Push Data Gate Image
        if: needs.detect-changes.outputs.datagate == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ./data-gate
        run: |
          LOWER_REPO=${{ steps.string_transform.outputs.lowercase }}
          docker build -t ${{ env.REGISTRY }}/${LOWER_REPO}/leadflow-data-gate:latest .
          docker push ${{ env.REGISTRY }}/${LOWER_REPO}/leadflow-data-gate:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook Deployment
        run: |
          curl -f -X POST "https://deploy.my-leads.app/hooks/deploy-leadflow" \
               -H "X-Deploy-Token: ${{ secrets.WEBHOOK_DEPLOY_TOKEN }}"
          echo "✅ Webhook trigger sent successfully to Hetzner!"