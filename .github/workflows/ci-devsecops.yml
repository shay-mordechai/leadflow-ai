name: DevSecOps CI Gate

on:
  pull_request:
    branches: [ "main", "staging" ]
  push:
    branches: [ "staging" ]

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'alembic/**'
              - 'requirements.txt'
              - 'pyproject.toml'
            frontend:
              - 'frontend/**'

  backend-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and security scanners
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit pytest pytest-asyncio pytest-mock
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Scan repository for leaked secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Linter (Ruff)
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run SAST (Bandit)
        run: bandit -r src/ -ll -ii

      - name: Run SCA Dependency Audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Run Automated Tests (Pytest)
        env:
          PYTHONPATH: "."
          ENVIRONMENT: "test"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          GOOGLE_API_KEY: "dummy_google_api_key_for_tests_only"
        run: pytest tests/ -v

  frontend-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install and Lint Frontend
        run: |
          npm ci
          npm run lint