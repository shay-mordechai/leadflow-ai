name: DevSecOps CI Gate

on:
  pull_request:
    branches: [ "main", "staging" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-and-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for accurate Gitleaks scan on PRs

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and security scanners
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit pytest pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Scan repository for leaked secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Linter (Ruff)
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run SAST (Bandit)
        # Scan source code for common security issues, fail on medium/high severity
        run: bandit -r src/ -ll -ii

      - name: Run SCA Dependency Audit (pip-audit)
        # Check installed packages against known CVE databases
        run: pip-audit

      - name: Run Automated Tests (Pytest)
        env:
          ENVIRONMENT: "test"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: pytest tests/ -v