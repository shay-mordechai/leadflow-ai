name: DevSecOps CI Gate

on:
  pull_request:
    branches: ["main", "staging"]
  push:
    branches: ["staging"]

# Cancel stale CI runs on the same PR branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Enforce least privilege globally; grant minimal permissions per job
permissions: {}

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'alembic/**'
              - 'alembic.ini'
              - 'Dockerfile'
              - 'requirements.txt'
              - 'pyproject.toml'
              - '.github/workflows/ci-devsecops.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-devsecops.yml'

  # Always scan the entire repository for leaked credentials regardless of changed paths
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-ci:
    name: Backend Lint, Security, Tests & PG15 Migrations
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: leadflow_ci_password
          POSTGRES_DB: leadflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U leadflow -d leadflow_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies and security scanners
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit pytest pytest-asyncio pytest-mock
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Fast, high-signal quality gates first (Fail Fast)
      - name: Run Linter and Formatter Check (Ruff)
        run: |
          ruff check src tests alembic
          ruff format --check src tests alembic

      - name: Run SAST (Bandit)
        run: bandit -r src/ -ll -ii

      - name: Run SCA Dependency Audit (pip-audit)
        run: pip-audit -r requirements.txt

      # Validate Alembic migration chain and schema parity against real PostgreSQL 15
      - name: Verify Alembic Migrations on PostgreSQL 15
        env:
          PYTHONPATH: "."
          ENVIRONMENT: "test"
          DATABASE_URL: "postgresql://leadflow:leadflow_ci_password@127.0.0.1:5432/leadflow_ci"
          ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          GOOGLE_API_KEY: "dummy_google_api_key_for_tests_only"
        run: |
          alembic upgrade head
          alembic check

      - name: Run Automated Tests (Pytest)
        env:
          PYTHONPATH: "."
          ENVIRONMENT: "test"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          GOOGLE_API_KEY: "dummy_google_api_key_for_tests_only"
        run: pytest tests/ -v

  frontend-ci:
    name: Frontend Lint, Audit, Tests & Build
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend SCA Audit (npm audit)
        run: npm audit --audit-level=high --omit=dev

      - name: Lint Frontend
        run: npm run lint

      - name: Run Frontend Unit Tests
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test -- --run
          fi

      - name: Verify Next.js Production Build
        env:
          NEXT_PUBLIC_API_URL: "https://my-leads.app"
        run: npm run build

  # Dry-run container builds run only after unit/lint gates succeed (Fail Fast)
  docker-backend-verify:
    name: Verify Backend Docker Build (No Push)
    needs: [detect-changes, backend-ci]
    if: needs.detect-changes.outputs.backend == 'true' && needs.backend-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Backend Container (Dry-Run)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  docker-frontend-verify:
    name: Verify Frontend Docker Build (No Push)
    needs: [detect-changes, frontend-ci]
    if: needs.detect-changes.outputs.frontend == 'true' && needs.frontend-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Frontend Container (Dry-Run)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Single required check for GitHub Branch Protection (handles path-filtered skips safely)
  ci-gate-summary:
    name: DevSecOps CI Gate Summary
    needs:
      - secret-scan
      - backend-ci
      - frontend-ci
      - docker-backend-verify
      - docker-frontend-verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate all gate results
        env:
          RESULTS_JSON: ${{ toJson(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS_JSON"
          if echo "$RESULTS_JSON" | grep -Eq '"(failure|cancelled)"'; then
            echo "One or more DevSecOps CI gates failed or were cancelled."
            exit 1
          fi
          echo "All applicable DevSecOps CI gates passed."