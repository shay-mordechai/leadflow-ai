name: CI Self-Healing Auto-Fix

on:
  workflow_run:
    workflows:
      - "LeadFlow Production Deploy (GHCR & Hetzner)"
      - "Nightly Security & Dependency Audit"
    types:
      - completed

# Prevent multiple workflows failing on the same commit from creating duplicate PRs
concurrency:
  group: autofix-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

# Enforce least privilege globally; grant write scopes only on the job that opens PRs
permissions: {}

jobs:
  autofix:
    name: Diagnose & Open Auto-Fix PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'fix(ci):') &&
      !startsWith(github.event.workflow_run.head_branch, 'autofix/')
    steps:
      - name: Check prerequisites and prevent duplicate auto-fix PRs
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [[ "$HAS_GEMINI_KEY" != "true" ]]; then
            echo "GEMINI_API_KEY secret is not configured; skipping auto-fix."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXISTING_PR=$(gh pr list --state open --search "head:autofix/ci-" --json number,headRefName \
            --jq 'length')
          if [[ "${EXISTING_PR:-0}" -gt 0 ]]; then
            echo "An open autofix PR already exists; skipping run #$RUN_ID for commit $HEAD_SHA."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout failed commit without persisting Git credentials
        if: steps.preflight.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        if: steps.preflight.outputs.proceed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install remediation tools and application dependencies
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --quiet google-genai pydantic ruff pytest pytest-asyncio pytest-mock
          # Allow failure here so broken requirements.txt files can still be diagnosed and patched
          if [ -f requirements.txt ]; then
            pip install --quiet -r requirements.txt || echo "Warning: requirements.txt install failed; proceeding to diagnosis."
          fi

      - name: Fetch failed job logs
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --log-failed | tail -n 200 > /tmp/failed_log.txt

      - name: Generate and validate fix with Gemini
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: python .github/scripts/autofix_ci.py

      - name: Enforce security guardrails on generated diff
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          CHANGED_FILES=$(git status --porcelain | awk '{print $2}')
          if [[ -z "$CHANGED_FILES" ]]; then
            exit 0
          fi

          echo "Files modified by auto-fix:"
          echo "$CHANGED_FILES"

          # Block LLM modifications to CI workflows, secrets, or deployment orchestration
          if echo "$CHANGED_FILES" | grep -Eq '^(\.github/|\.env|compose\.yaml|terraform/)'; then
            echo "ERROR: Refusing auto-fix patch touching protected CI or infrastructure files."
            git reset --hard HEAD
            git clean -fd
            exit 1
          fi

      - name: Push branch and open Pull Request
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes produced; skipping PR creation."
            exit 0
          fi

          BRANCH="autofix/ci-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit --no-verify -m "fix(ci): auto-remediate workflow failure #${RUN_ID}"

          # Authenticate push using an ephemeral header instead of persisted credentials
          AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            push origin "$BRANCH"

          SUMMARY="Automated remediation generated for failed workflow **${WORKFLOW_NAME}**: ${RUN_URL}"
          if [[ -f /tmp/autofix_summary.md ]]; then
            SUMMARY=$(printf "%s\n\n%s" "$SUMMARY" "$(cat /tmp/autofix_summary.md)")
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "fix(ci): auto-fix failure in run #${RUN_ID}" \
            --body "$SUMMARY"