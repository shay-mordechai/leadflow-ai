version: 2
updates:
  # 1. Frontend Dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Asia/Jerusalem"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@types/node"

  # 2. Backend Dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Asia/Jerusalem"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "backend"
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # botocore requires python-dateutil<3.0.0
      - dependency-name: "python-dateutil"
        versions: [">=3.0.0"]
      # Legacy SDK requires protobuf>=6.33.5; project uses google-genai
      - dependency-name: "google-ai-generativelanguage"
        versions: [">=0.7.0"]
      # Keep bcrypt on 4.0.x for password hashing compatibility
      - dependency-name: "bcrypt"
        versions: [">=4.1.0"]

  # 3. Backend Container Base Image (keep pinned to Python 3.12 minor/patch releases)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Asia/Jerusalem"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(docker)"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 4. Frontend Container Base Image (keep pinned to Node 22 minor/patch releases)
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Asia/Jerusalem"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(docker)"
    labels:
      - "dependencies"
      - "docker"
      - "frontend"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 5. CI/CD Pipeline Actions (GitHub Actions)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Asia/Jerusalem"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions-updates:
        patterns:
          - "*"
