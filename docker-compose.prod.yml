version: '3.8'

services:
  # 1. The Brain: FastAPI Application
  web:
    build: .
    container_name: leadflow_app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 4
    volumes:
      - ./storage:/app/storage  # שומרים על ההקלטות גם אם השרת נופל
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always  # קריטי! אם השרת קורס, הוא יעלה לבד מחדש

  # 2. The Muscle: Celery Worker (Background Tasks)
  worker:
    build: .
    container_name: leadflow_worker
    command: celery -A src.worker.tasks worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always

  # 3. Memory: PostgreSQL Database
  db:
    image: postgres:15
    container_name: leadflow_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=coaching_db
    restart: always

  # 4. Speed: Redis (For Task Queue)
  redis:
    image: redis:7
    container_name: leadflow_redis
    restart: always

volumes:
  postgres_data:
