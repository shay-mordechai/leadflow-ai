# docker-compose.prod.yml
version: '3.8'

services:
  # --- Main Application Service ---
  app:
    # Uses dynamic tag from GitHub Actions, falls back to 'latest' if manual
    image: ghcr.io/shay-mordechai/leadflow-ai:${IMAGE_TAG:-latest}
    container_name: leadflow-ai
    restart: always
    
    # NETWORK CONFIGURATION:
    # We expose port 8000 to the Host OS.
    # The system-level Cloudflare Tunnel connects to localhost:8000.
    ports:
      - "8000:8000"
    
    # --- CRITICAL ENVIRONMENT OVERRIDES ---
    # These settings enforce the fixes we discovered during debugging.
    environment:
      - WEB_CONCURRENCY=1               # Limit to 1 worker to save RAM on t3.micro
      - ENABLE_REAL_PHONE_PURCHASE=true # Forces the phone module to load
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - ALGORITHM=HS256                 # Required for JWT encoding
      - APP_ENV=production

    volumes:
      # The ':Z' flag is crucial for Podman/SELinux permissions
      - ./storage:/app/storage:Z
      - ./leads.db:/app/leads.db:Z
      - ./private.key:/app/private.key:Z
    
    # Load additional secrets (AWS keys, etc.) from .env file
    env_file:
      - .env

    # Command updated to use 1 worker explicitly for stability
    command: >
      gunicorn src.main:app
      --workers 1
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
      --access-logfile -
      --error-logfile -
      --log-level info

  # --- SIDE NOTE ---
  # The 'tunnel' service has been removed.
  # We are now using the Host's systemd-managed tunnel for both SSH and HTTP.