# docker-compose.prod.yml
version: '3.8'

services:
  app:
    # ⬇️ CHANGE IS HERE: Use dynamic tag with fallback to 'latest'
    image: ghcr.io/shay-mordechai/leadflow-ai:${IMAGE_TAG:-latest}
    container_name: leadflow-ai
    restart: always
    ports:
      - "8000:8000"

    volumes:
      - ./storage:/app/storage:Z
      - ./leads.db:/app/leads.db:Z
      - ./private.key:/app/private.key:Z

    command: >
      gunicorn src.main:app
      --workers 2
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
      --access-logfile -
      --error-logfile -
      --log-level info
