# docker-compose.prod.yml
version: '3.8'

services:
  app:
    # Production Image: Pulled from GitHub Container Registry
    image: ghcr.io/shay-mordechai/leadflow-ai:latest
    container_name: leadflow-ai
    
    # Restart Policy: Ensures app recovers after crashes or reboots
    restart: always
    
    # Port Mapping: Expose port 8000 to the host so Cloudflared can reach it.
    # Note: Using standard port mapping is more stable than 'network_mode: host' for rootless Podman.
    ports:
      - "8000:8000"
    
    # Note: 'env_file' is removed.
    # The application fetches secrets directly from AWS SSM using the EC2 IAM Role.
    
    # Storage Persistence:
    # 1. storage: For audio files.
    # 2. leads.db: CRITICAL for SQLite! Maps the DB file to the host to prevent data loss on deploy.
    volumes:
      - ./storage:/app/storage
      - ./leads.db:/app/leads.db

    # Command Override:
    # Explicitly sets Gunicorn parameters to ensure logs are piped to stdout/stderr.
    # This guarantees 'podman logs' works correctly.
    command: >
      gunicorn src.main:app 
      --workers 2 
      --worker-class uvicorn.workers.UvicornWorker 
      --bind 0.0.0.0:8000 
      --timeout 120
      --access-logfile - 
      --error-logfile - 
      --log-level info

  # Note: The Cloudflare Tunnel is NOT defined here.
  # It is managed by systemd on the server to ensure high availability.