# docker-compose.prod.yml
version: '3.8'

services:
  # --- Main Backend Application ---
  app:
    image: ghcr.io/shay-mordechai/leadflow-backend:latest
    container_name: leadflow-backend
    restart: always
    
    # Using host network to simplify Cloudflare Tunnel integration
    network_mode: "host"
    
    environment:
      - APP_ENV=production
      - AWS_REGION=eu-north-1
      # CRITICAL: Absolute path ensures SQLite uses the mounted Volume
      - DATABASE_URL=sqlite:////app/data/leads.db
      - S3_BUCKET_NAME=leadflow-user-assets-prod # Updated to correct bucket name
      - WEB_CONCURRENCY=1               
      - ENABLE_REAL_PHONE_PURCHASE=true 
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - ALGORITHM=HS256

    volumes:
      # Use ':Z' for SELinux compatibility on Amazon Linux/Fedora
      - ./storage:/app/storage:Z
      - ./data:/app/data:Z
      - ./private.key:/app/private.key:Z
    
    # Explicitly enforce 1 worker to prevent SQLAlchemy race conditions during migrations
    command: >
      gunicorn src.main:app
      --workers 1
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
      --access-logfile -
      --error-logfile -
      --log-level info