{% extends "base.html" %}

{% block content %}
    <header class="relative pt-10 pb-20 md:pt-20 md:pb-32 container mx-auto px-6 text-center max-w-5xl">
        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-sm font-bold mb-8 animate-fade-in-up">
            <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
            הפלאפון של העבודה משתלט לך על החיים האישיים?
        </div>

        <h1 class="text-5xl md:text-7xl lg:text-8xl font-black font-display leading-[1.1] mb-8 tracking-tight">
            תמלול פגישות וניהול לידים<br/>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400 drop-shadow-2xl">בפרטיות מוחלטת</span>
        </h1>
        
        <p class="text-lg md:text-2xl text-slate-400 mb-12 max-w-3xl mx-auto leading-relaxed font-light">
            המערכת שתקשיב להודעות הקוליות במקומך, תבין מה הלקוח רוצה, ותנסח תשובה מדויקת תוך שניות.
        </p>

        <div class="flex flex-col md:flex-row gap-5 justify-center items-center">
            <div class="flex flex-col items-center w-full md:w-auto group">
                <a href="/register" class="btn-shimmer animate-shimmer w-full md:w-auto relative px-10 py-5 rounded-2xl font-bold text-lg text-white shadow-[0_10px_40px_-10px_rgba(37,99,235,0.5)] hover:shadow-[0_20px_60px_-15px_rgba(37,99,235,0.6)] hover:-translate-y-1 transition-all duration-300 border border-blue-400/30">
                    אני רוצה לנסות בחינם
                    <i class="fas fa-arrow-left mr-2 transition-transform group-hover:-translate-x-1"></i>
                </a>
                <span class="text-xs text-slate-500 mt-2">ללא צורך בכרטיס אשראי</span>
            </div>
        </div>
    </header>

    <div class="border-y border-white/5 bg-slate-900/50 backdrop-blur-sm py-12 relative z-10">
        <div class="flex flex-wrap justify-center items-center gap-8 md:gap-16 grayscale opacity-70 hover:grayscale-0 hover:opacity-100 transition duration-500">
            <i class="fab fa-aws text-4xl md:text-5xl text-slate-400 hover:text-[#FF9900]"></i>
            <i class="fab fa-google text-4xl md:text-5xl text-slate-400 hover:text-[#EA4335]"></i>
            <i class="fab fa-whatsapp text-4xl md:text-5xl text-slate-400 hover:text-[#25D366]"></i>
            <i class="fas fa-shield-alt text-4xl md:text-5xl text-slate-400 hover:text-blue-500"></i>
        </div>
    </div>
{% endblock %}
