<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הגדרות הבוט | LeadFlowAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700&display=swap'); body { font-family: 'Heebo', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 p-4 flex justify-between items-center shadow-sm">
        <h1 class="font-bold text-lg">⚙️ הגדרות ה-AI</h1>
        <a href="/dashboard" class="text-slate-500 hover:text-blue-600"><i class="fas fa-times text-xl"></i></a>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-6">
        
        <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl flex gap-3">
            <i class="fas fa-brain text-blue-600 mt-1"></i>
            <div>
                <h3 class="font-bold text-blue-900 text-sm">איך זה עובד?</h3>
                <p class="text-xs text-blue-700 mt-1">מה שתכתוב כאן ישפיע ישירות על איך שג'מיני ינתח את השיחות ויציע תשובות בוואטסאפ.</p>
            </div>
        </div>

        <form id="settingsForm" class="space-y-6">
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h2 class="font-bold text-slate-900 border-b pb-2">📦 מידע כללי</h2>
                
                <div>
                    <label class="block text-sm font-bold mb-1">שם העסק (כפי שיופיע בתשובות)</label>
                    <input type="text" name="business_name" id="businessName" class="w-full p-3 bg-slate-50 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="יוסי כהן נדל״ן">
                </div>

                <div>
                    <label class="block text-sm font-bold mb-1">תחום עיסוק</label>
                    <select name="business_type" id="businessType" class="w-full p-3 bg-slate-50 rounded-lg border border-slate-200 outline-none">
                        <option value="Real Estate">נדל"ן</option>
                        <option value="Fitness">כושר ובריאות</option>
                        <option value="E-commerce">מסחר אלקטרוני</option>
                        <option value="Consulting">ייעוץ ושירותים</option>
                        <option value="Other">אחר</option>
                    </select>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h2 class="font-bold text-slate-900 border-b pb-2">🧠 אישיות הבוט</h2>

                <div>
                    <label class="block text-sm font-bold mb-1">טון הדיבור</label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="ai_tone" value="Formal" class="peer sr-only">
                            <div class="p-3 text-center rounded-lg border border-slate-200 peer-checked:bg-blue-600 peer-checked:text-white peer-checked:border-blue-600 transition text-sm">
                                👔 רשמי
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="ai_tone" value="Friendly" class="peer sr-only">
                            <div class="p-3 text-center rounded-lg border border-slate-200 peer-checked:bg-blue-600 peer-checked:text-white peer-checked:border-blue-600 transition text-sm">
                                👋 חברי
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="ai_tone" value="Sales" class="peer sr-only">
                            <div class="p-3 text-center rounded-lg border border-slate-200 peer-checked:bg-blue-600 peer-checked:text-white peer-checked:border-blue-600 transition text-sm">
                                💰 מכירתי
                            </div>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold mb-1">השירותים/מוצרים שלך</label>
                    <textarea name="products_services" id="products" rows="3" class="w-full p-3 bg-slate-50 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="למשל: אימון אישי עולה 250 ש״ח, מנוי חודשי 400 ש״ח. אנחנו פתוחים מ-8 בבוקר עד 10 בלילה..."></textarea>
                    <p class="text-xs text-slate-400 mt-1">הבוט ישתמש במידע הזה כדי לענות על שאלות הלקוח.</p>
                </div>

                <div>
                    <label class="block text-sm font-bold mb-1">הוראות מיוחדות (System Prompt)</label>
                    <textarea name="custom_instructions" id="instructions" rows="2" class="w-full p-3 bg-slate-50 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="למשל: לעולם אל תיתן מחיר בטלפון, תמיד תבקש לקבוע פגישת זום."></textarea>
                </div>
            </div>

            <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-slate-800 transition active:scale-95">
                שמור הגדרות
            </button>
        </form>
    </main>

    <script>
        // Load settings on page load
        async function loadSettings() {
            try {
                const res = await fetch('/api/v1/settings/');
                if (!res.ok) return;
                const data = await res.json();
                
                document.getElementById('businessName').value = data.business_name || '';
                document.getElementById('businessType').value = data.business_type || 'Other';
                document.getElementById('products').value = data.products_services || '';
                document.getElementById('instructions').value = data.custom_instructions || '';
                
                // Select Radio Button
                const tone = data.ai_tone || 'Professional';
                document.querySelector(`input[name="ai_tone"][value="${tone}"]`).checked = true;
            } catch (e) {
                console.error("Failed to load settings");
            }
        }

        // Save settings
        document.getElementById('settingsForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'שומר...';
            btn.disabled = true;

            const formData = new FormData(e.target);
            const payload = Object.fromEntries(formData.entries());

            try {
                const res = await fetch('/api/v1/settings/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    alert('✅ ההגדרות נשמרו בהצלחה! מעכשיו הבוט יעבוד לפי ההוראות החדשות.');
                    window.location.href = '/dashboard';
                } else {
                    alert('שגיאה בשמירה.');
                }
            } catch (e) {
                alert('שגיאת תקשורת.');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        };

        loadSettings();
    </script>
</body>
</html>
