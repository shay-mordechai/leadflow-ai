<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>התחברות | My-Leads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Heebo', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); }
        /* Custom Checkbox Style */
        .checkbox-wrapper input:checked + div { background-color: #0f172a; border-color: #0f172a; }
        .checkbox-wrapper input:checked + div svg { display: block; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute top-0 right-0 w-96 h-96 bg-blue-600/30 rounded-full blur-[100px] animate-pulse"></div>
    <div class="absolute bottom-0 left-0 w-96 h-96 bg-purple-600/20 rounded-full blur-[100px]"></div>

    <div class="max-w-sm w-full glass-card rounded-3xl shadow-2xl relative z-10 overflow-hidden">
        
        <div class="p-8 pb-0 text-center">
            <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg text-white text-xl">
                <i class="fas fa-bolt"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800">ברוכים השבים</h1>
            <p class="text-slate-500 text-sm mt-1">התחבר למערכת הניהול</p>
        </div>

        <form id="loginForm" class="p-8 space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">מספר וואטסאפ</label>
                <input type="tel" name="phone" required dir="ltr" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition text-right placeholder-slate-300 font-bold text-slate-800" placeholder="050-XXXXXXX">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">סיסמה</label>
                <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition placeholder-slate-300" placeholder="••••••••">
            </div>

            <div class="flex items-center justify-between">
                <label class="flex items-center cursor-pointer checkbox-wrapper group">
                    <input type="checkbox" name="remember_me" class="hidden">
                    <div class="w-5 h-5 border-2 border-slate-300 rounded-md flex items-center justify-center transition-colors mr-2 group-hover:border-blue-400">
                        <svg class="w-3 h-3 text-white hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <span class="text-sm text-slate-600 select-none mr-2">השאר אותי מחובר</span>
                </label>
                <a href="#" class="text-xs font-bold text-blue-600 hover:text-blue-800">שכחתי סיסמה?</a>
            </div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-xl shadow-lg transition transform active:scale-[0.98]">
                כניסה למערכת
            </button>

            <div class="text-center mt-4 pt-4 border-t border-slate-100">
                <a href="/register" class="text-sm text-slate-500 hover:text-blue-600">אין לך חשבון? <span class="font-bold underline">הירשם כאן</span></a>
            </div>
        </form>
    </div>
    <script>
    document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const originalText = btn.innerHTML;
        btn.innerHTML = 'מתחבר...'; 
        btn.disabled = true;

        const formData = new FormData(e.target);
        const emailValue = formData.get('phone'); 
        const rememberMe = formData.get('remember_me') === 'on'; // Check if user checked the box

        const data = {
            email: emailValue,
            password: formData.get('password'),
            // We can send remember_me to server if we implement Refresh Tokens later
            remember_me: rememberMe 
        };

        try {
            console.log('Sending login request...', data);
            const response = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                console.log('Login successful');

                if (result.access_token) {
                    // 1. Save to LocalStorage (Optional, mostly for API calls)
                    localStorage.setItem('token', result.access_token);
                    
                    // 2. COOKIE LOGIC (Long expiry vs Short expiry)
                    const now = new Date();
                    let expiryTime;

                    if (rememberMe) {
                        // 30 Days if "Remember Me" is checked
                        expiryTime = 30 * 24 * 60 * 60 * 1000;
                    } else {
                        // 24 Hours if NOT checked
                        expiryTime = 24 * 60 * 60 * 1000;
                    }

                    now.setTime(now.getTime() + expiryTime);
                    
                    // Set the cookie with the calculated expiry
                    document.cookie = `access_token=${result.access_token}; expires=${now.toUTCString()}; path=/; SameSite=Lax; Secure`;
                    
                    console.log(`Cookie set. Remember Me: ${rememberMe}. Expires in: ${expiryTime/1000/60/60} hours.`);
                }
                
                window.location.href = '/dashboard';
            } else {
                // If location check failed (401), this block will run
                console.error('Login failed:', result);
                const errorMsg = result.detail?.[0]?.msg || result.detail || 'פרטי התחברות שגויים';
                alert('שגיאה: ' + errorMsg);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        } catch (error) {
            console.error('Network Error:', error);
            alert('שגיאת תקשורת. נא לבדוק את החיבור.');
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
