<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>התחברות | My-Leads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap');
        body { font-family: 'Heebo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-sm w-full bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">

        <div class="bg-slate-900 p-8 text-center">
            <h1 class="text-2xl font-bold text-white mb-2">ברוכים השבים</h1>
            <p class="text-slate-400 text-sm">התחבר למערכת הניהול</p>
        </div>

        <form id="loginForm" class="p-8 space-y-5">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">מספר וואטסאפ</label>
                <input type="tel" name="phone" required dir="ltr" class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 transition text-right placeholder-slate-400" placeholder="050-XXXXXXX">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">סיסמה</label>
                <input type="password" name="password" required class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/30 transition transform active:scale-95">
                כניסה למערכת
            </button>

            <div class="text-center mt-4">
                <a href="/register" class="text-sm text-slate-500 hover:text-blue-600">אין לך עדיין חשבון? <span class="font-bold">הירשם כאן</span></a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerHTML = '🔄 מתחבר...';
            btn.disabled = true;

            const formData = new FormData(e.target);
            // המרה לפורמט שהשרת מצפה (OAuth2 לרוב מצפה ל-username/password)
            const payload = new URLSearchParams();
            payload.append('username', formData.get('phone'));
            payload.append('password', formData.get('password'));

            try {
                const response = await fetch('/api/v1/auth/token', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: payload
                });

                if (response.ok) {
                    window.location.href = '/dashboard';
                } else {
                    alert('פרטי התחברות שגויים');
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                alert('שגיאת תקשורת');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
