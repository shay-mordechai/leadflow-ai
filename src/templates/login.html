<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>התחברות | My-Leads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Heebo', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute top-0 right-0 w-96 h-96 bg-blue-600/30 rounded-full blur-[100px] animate-pulse"></div>
    <div class="absolute bottom-0 left-0 w-96 h-96 bg-purple-600/20 rounded-full blur-[100px]"></div>

    <div class="max-w-sm w-full glass-card rounded-3xl shadow-2xl relative z-10 overflow-hidden">
        
        <div class="p-8 pb-0 text-center">
            <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg text-white text-xl">
                <i class="fas fa-bolt"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800">ברוכים השבים</h1>
            <p class="text-slate-500 text-sm mt-1">התחבר למערכת הניהול</p>
        </div>

        <form id="loginForm" class="p-8 space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">מספר וואטסאפ</label>
                <input type="tel" name="phone" required dir="ltr" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition text-right placeholder-slate-300 font-bold text-slate-800" placeholder="050-XXXXXXX">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">סיסמה</label>
                <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition placeholder-slate-300" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-xl shadow-lg transition transform active:scale-[0.98]">
                כניסה למערכת
            </button>

            <div class="text-center mt-4 pt-4 border-t border-slate-100">
                <a href="/register" class="text-sm text-slate-500 hover:text-blue-600">אין לך חשבון? <span class="font-bold underline">הירשם כאן</span></a>
            </div>
        </form>
    </div>
    
    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerHTML = '...מתחבר';
            btn.disabled = true;

            const formData = new FormData(e.target);
            const payload = new URLSearchParams();
            payload.append('username', formData.get('phone'));
            payload.append('password', formData.get('password'));

            try {
                const response = await fetch('/api/v1/auth/token', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: payload
                });

                if (response.ok) {
                    window.location.href = '/dashboard';
                } else {
                    alert('פרטי התחברות שגויים');
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                alert('שגיאת תקשורת');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
