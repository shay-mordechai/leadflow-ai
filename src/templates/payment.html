<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>הפעלת חשבון | My-Leads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Heebo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute top-0 right-0 w-96 h-96 bg-blue-600/20 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-0 left-0 w-96 h-96 bg-purple-600/20 rounded-full blur-[100px]"></div>

    <div class="max-w-md w-full bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl overflow-hidden relative z-10">
        <div class="bg-slate-800 p-8 text-center text-white relative overflow-hidden">
            <div class="absolute inset-0 bg-blue-600/10"></div>
            <div class="relative z-10">
                <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30">
                    <i class="fas fa-rocket text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl font-black">כמעט סיימנו!</h1>
                <p class="text-slate-300 mt-2 text-sm">השלם את התשלום להפעלת המערכת</p>
            </div>
        </div>

        <div class="p-8">
            <div class="bg-blue-50 border border-blue-100 rounded-2xl p-6 mb-8 text-center relative">
                <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-blue-600 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                    חבילת Starter
                </div>
                <p class="text-slate-600 text-sm mb-1 font-medium">סכום לתשלום</p>
                <h2 class="text-5xl font-black text-slate-800 tracking-tight">₪99<span class="text-lg font-normal text-slate-500">/חודש</span></h2>
            </div>

            <div class="space-y-6">
                <div class="flex items-start bg-slate-50 p-4 rounded-xl">
                    <div class="bg-green-100 text-green-600 p-2 rounded-lg ml-4 shrink-0">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-sm">תשלום מאובטח ב-Bit</h3>
                        <p class="text-xs text-slate-500 mt-1 leading-relaxed">אנחנו משתמשים ב-Bit כדי להבטיח את פרטיותך ולא שומרים פרטי אשראי בשרתים שלנו.</p>
                    </div>
                </div>

                <div class="border-t border-slate-100 pt-6">
                    <p class="text-center text-slate-700 font-bold mb-4 text-sm">שלם למספר הבא:</p>
                    <button onclick="copyNumber()" class="w-full bg-slate-100 hover:bg-slate-200 p-4 rounded-xl flex items-center justify-between gap-4 group transition border border-slate-200">
                        <span class="text-2xl font-mono font-bold tracking-widest text-slate-700 group-hover:text-blue-600 transition" id="phoneNum">050-1234567</span>
                        <div class="flex items-center gap-2 text-slate-400 group-hover:text-blue-600">
                            <span class="text-xs font-bold">העתק</span>
                            <i class="far fa-copy"></i>
                        </div>
                    </button>
                </div>
            </div>

            <div class="mt-8 space-y-4">
                <a href="https://www.bitpay.co.il/" target="_blank" class="block w-full text-center bg-[#00d07a] hover:bg-[#00b068] text-white py-4 rounded-2xl font-bold text-lg shadow-lg shadow-green-500/20 transition transform hover:scale-[1.02]">
                    פתח אפליקציית Bit
                </a>
                <p class="text-xs text-center text-slate-400 leading-relaxed px-4">
                    לאחר התשלום, שלח לנו צילום מסך בוואטסאפ.<br>
                    חשבונך יופעל אוטומטית תוך דקות.
                </p>
            </div>
        </div>
    </div>

    <script>
        function copyNumber() {
            const num = document.getElementById('phoneNum').innerText;
            navigator.clipboard.writeText(num);
            
            // Visual Feedback
            const btn = document.querySelector('button[onclick="copyNumber()"]');
            const originalContent = btn.innerHTML;
            
            btn.classList.add('bg-green-50', 'border-green-200');
            btn.innerHTML = `<span class="text-green-600 font-bold mx-auto">המספר הועתק! ✅</span>`;
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.classList.remove('bg-green-50', 'border-green-200');
            }, 2000);
        }
    </script>
</body>
</html>
