<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול יומן | LeadFlowAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap');
        body { font-family: 'Heebo', sans-serif; background-color: #f8fafc; }

        /* Interactive Slot Styles */
        .slot { transition: all 0.2s; cursor: pointer; }
        .slot:hover { transform: scale(1.05); }
        .slot.active { background-color: #3b82f6; color: white; border-color: #2563eb; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); }
        .slot.inactive { background-color: white; color: #cbd5e1; border-color: #e2e8f0; }
    </style>
</head>
<body class="pb-20">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 p-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <a href="/dashboard" class="bg-slate-100 p-2 rounded-full text-slate-600 hover:bg-slate-200 transition"><i class="fas fa-arrow-right"></i></a>
            <h1 class="font-bold text-slate-800 text-lg">ניהול זמינות (14 יום)</h1>
        </div>
        <div class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded">
            הקש כדי לפתוח/לסגור חלון
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-2xl">
        <p class="text-slate-500 text-sm mb-6 text-center">סמן את השעות בהן אתה פנוי לפגישות. הלקוחות יראו רק את מה שתסמן.</p>

        <div id="calendar-grid" class="space-y-8">
            <!-- JS will inject days here -->
        </div>

        <div class="fixed bottom-6 left-0 right-0 px-4">
             <div class="bg-slate-900 text-white text-center py-3 rounded-xl shadow-xl text-sm max-w-md mx-auto">
                 קישור לזימון: <span class="font-mono text-blue-300">leadflow.ai/book/{{ tenant_id }}</span>
             </div>
        </div>
    </main>

    <script>
        // Data from Backend
        // 'active_slots' is a Set of strings "YYYY-MM-DD HH:MM"
        const activeSlots = new Set([
            {% for s in active_slots %}"{{ s }}",{% endfor %}
        ]);

        const container = document.getElementById('calendar-grid');
        const days = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];

        // Generate next 14 days
        const today = new Date();

        for(let i=0; i<14; i++) {
            const date = new Date(today);
            date.setDate(today.getDate() + i);
            const dateStr = date.toISOString().split('T')[0];
            const dayName = days[date.getDay()];
            const displayDate = `${dayName} - ${date.getDate()}/${date.getMonth()+1}`;

            // Create Day Wrapper
            const dayWrapper = document.createElement('div');
            dayWrapper.innerHTML = `<h3 class="font-bold text-slate-700 mb-3 border-r-4 border-blue-500 pr-2">${displayDate}</h3>`;

            const grid = document.createElement('div');
            grid.className = "grid grid-cols-4 gap-3";

            // Generate Hours 09:00 to 18:00
            for(let h=9; h<=18; h++) {
                const timeStr = `${h < 10 ? '0'+h : h}:00`;
                const fullKey = `${dateStr} ${timeStr}`;
                const isActive = activeSlots.has(fullKey);

                const slot = document.createElement('div');
                slot.className = `slot border rounded-xl py-3 text-center font-bold text-sm ${isActive ? 'active' : 'inactive'}`;
                slot.innerText = timeStr;

                slot.onclick = () => toggleSlot(slot, dateStr, timeStr);
                grid.appendChild(slot);
            }

            dayWrapper.appendChild(grid);
            container.appendChild(dayWrapper);
        }

        async function toggleSlot(el, date, time) {
            // Optimistic UI update
            const wasActive = el.classList.contains('active');
            el.classList.toggle('active');
            el.classList.toggle('inactive');

            try {
                const res = await fetch('/api/v1/schedule/toggle', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ date_str: date, time_str: time })
                });

                if(!res.ok) {
                    const err = await res.json();
                    alert(err.detail || "שגיאה");
                    // Revert UI
                    el.classList.toggle('active');
                    el.classList.toggle('inactive');
                }
            } catch(e) {
                alert("שגיאת רשת");
            }
        }
    </script>
</body>
</html>
